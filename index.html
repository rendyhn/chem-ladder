{
  id: 'buffers-salts', stage: 'sh', title: 'Buffers & Salt Hydrolysis',
  blurb: 'Acidic, basic and neutral salts, hydrolysis and the pH of salt solutions, buffer solutions, how they resist pH change, the Henderson–Hasselbalch equation, and blood as a buffer.',
  lesson: () => T`
<p>Salts are not always neutral. The ion from a <b>weak</b> acid or base reacts with water (<b>hydrolysis</b>): $\ce{CH3COO- + H2O <=> CH3COOH + OH-}$ makes sodium ethanoate solution basic; $\ce{NH4+ + H2O <=> NH3 + H3O+}$ makes ammonium chloride solution acidic.</p>
${Tbl([T`Salt made from`, T`Example`, T`Solution`], [[T`strong acid + strong base`, '$\\ce{NaCl}$, $\\ce{KNO3}$', T`neutral (pH 7)`], [T`weak acid + strong base`, '$\\ce{CH3COONa}$, $\\ce{Na2CO3}$', T`basic (pH > 7)`], [T`strong acid + weak base`, '$\\ce{NH4Cl}$, $\\ce{(NH4)2SO4}$', T`acidic (pH < 7)`]])}
${Key(T`<p>For a basic salt $[\ce{OH-}] = \sqrt{\frac{K_w}{K_a} \cdot c}$; for an acidic salt $[\ce{H+}] = \sqrt{\frac{K_w}{K_b} \cdot c}$.</p>`)}
<h3>Buffers</h3>
<p>A <b>buffer</b> keeps the pH almost constant when a little acid or base is added. It contains a weak acid and its conjugate base (e.g. $\ce{CH3COOH}$ + $\ce{CH3COONa}$) or a weak base and its conjugate acid ($\ce{NH3}$ + $\ce{NH4Cl}$). Added $\ce{H+}$ is taken up by $\ce{A-}$; added $\ce{OH-}$ is neutralised by $\ce{HA}$.</p>

<p>If the two halves of a redox reaction are separated, the electrons must travel through a wire: the reaction produces an electric current. This is a <b>galvanic</b> (voltaic) <b>cell</b>.</p>

  lesson: () => T`
<p>In <b>electrolysis</b> an electric current forces a non-spontaneous redox reaction to happen. The liquid that conducts (a molten ionic compound or a solution of ions) is the <b>electrolyte</b>. Positive ions (cations) move to the negative electrode, the <b>cathode</b>, and are reduced; negative ions (anions) move to the positive <b>anode</b> and are oxidised.</p>
${Fig(electrolysisSvg({ names: [T`cathode (−)`, T`anode (+)`], label: T`Electrolysis of copper chloride solution: copper forms at the cathode, chlorine gas bubbles at the anode` }), T`Electrolysis of $\ce{CuCl2(aq)}$ with inert graphite electrodes: $\ce{Cu^2+ + 2e- -> Cu}$ at the cathode, $\ce{2Cl- -> Cl2 + 2e-}$ at the anode.`)}
${Key(T`<p><b>Molten</b> compound: the metal forms at the cathode and the non-metal at the anode ($\ce{NaCl(l)}$ gives Na and $\ce{Cl2}$).<br><b>Aqueous</b> solution: water can react too.<br>Cathode: a metal below hydrogen in reactivity (Cu, Ag) is deposited; otherwise (Na, K, Mg, Al) hydrogen is produced.<br>Anode (inert electrodes): chlorine, bromine or iodine from concentrated halides; otherwise ($\ce{SO4^2-}$, $\ce{NO3-}$) oxygen is produced from water.</p>`)}
${Tbl([T`Electrolyte (inert electrodes)`, T`At the cathode`, T`At the anode`], [['$\\ce{NaCl(l)}$', 'Na', '$\\ce{Cl2}$'], [T`$\ce{NaCl(aq)}$, concentrated`, '$\\ce{H2}$', '$\\ce{Cl2}$'], ['$\\ce{CuSO4(aq)}$', 'Cu', '$\\ce{O2}$'], [T`$\ce{H2SO4(aq)}$, dilute`, '$\\ce{H2}$', '$\\ce{O2}$'], ['$\\ce{KI(aq)}$', '$\\ce{H2}$', '$\\ce{I2}$']])}
<h3>Faraday's laws</h3>
${Fm(T`Q = I\,t \qquad n(e^-) = \frac{Q}{F} \qquad m = \frac{I\,t\,M}{z\,F}`)}
<p>where $F = 96\,485$ C/mol is the Faraday constant (the charge of one mole of electrons) and $z$ the number of electrons per ion. The mass deposited is proportional to the charge passed.</p>
${Ex(T`<p>A current of 2.00 A for 30.0 min through $\ce{CuSO4}$: $Q = 2.00 \times 1800 = 3600$ C; $n(e^-) = \frac{3600}{96\,485} = 0.0373$ mol; $n(\ce{Cu}) = 0.0187$ mol; $m = 0.0187 \times 63.5 = 1.18$ g.</p>`)}
${Tip(T`<p>Uses: aluminium extraction from molten alumina in cryolite (Hall–Héroult), the chlor-alkali industry ($\ce{Cl2}$, $\ce{H2}$ and NaOH from brine), purifying copper (impure anode, pure cathode), and electroplating (the object to be plated is the cathode).</p>`)}`,

{
  id: 'corrosion', stage: 'jh', title: 'Corrosion & Its Prevention',
  blurb: 'Rusting of iron as an electrochemical process, the conditions for rusting, and ways to prevent it: barriers, galvanising, sacrificial protection and alloys.',
  lesson: () => T`
<p><b>Corrosion</b> is the slow destruction of a metal by reaction with its environment. The corrosion of iron is called <b>rusting</b>; rust is hydrated iron(III) oxide, $\ce{Fe2O3.xH2O}$. Unlike the thin oxide layer on aluminium, rust is flaky and falls off, so fresh iron keeps being exposed.</p>
${Fig(rustTubesSvg({ names: [T`air + water: rusts`, T`boiled water + oil: no rust`, T`dry air (drying agent): no rust`], label: T`Three test tubes with iron nails: in air and water the nail rusts; in boiled water under oil and in dry air it does not` }), T`The classic experiment: iron rusts only when <b>both oxygen and water</b> are present. Boiling removes dissolved air and the oil layer keeps it out; calcium chloride keeps the air dry. Salt water speeds rusting up.`)}
${Key(T`<p>Rusting is electrochemical. Part of the iron surface acts as an anode: $\ce{Fe -> Fe^2+ + 2e-}$. The electrons flow through the metal to where oxygen is reduced: $\ce{O2 + 2H2O + 4e- -> 4OH-}$. $\ce{Fe^2+}$ and $\ce{OH-}$ form $\ce{Fe(OH)2}$, which is oxidised further to rust.</p>`)}
${Tbl([T`Method`, T`How it works`, T`Examples`], [[T`barrier: paint, oil, grease, plastic`, T`keeps out air and water`, T`cars, bicycle chains, fences`], [T`galvanising (zinc coating)`, T`barrier, and zinc corrodes first even if scratched`, T`buckets, roofs, lamp posts`], [T`sacrificial protection`, T`a more reactive metal (Zn, Mg) is joined to the iron and is oxidised instead`, T`ships’ hulls, underground pipes`], [T`tin plating`, T`barrier only; if scratched the iron rusts faster`, T`food cans`], [T`alloying`, T`stainless steel contains chromium and nickel, which form a protective oxide layer`, T`cutlery, sinks`], [T`cathodic protection`, T`a power supply makes the iron the cathode`, T`pipelines, bridges`]])}
${Tip(T`<p>Corrosion costs about 3–4% of the world's GDP every year (NACE International, 2016). Aluminium, zinc and chromium look reactive on paper but resist corrosion because a thin, tight oxide layer protects them.</p>`)}`,

${FigRow([[dispMol(['C', 'C'], { subs: [[1, 'right', 'OH']], label: T`Ethanol` }), T`alcohol: ethanol`], [dispMol(['C', 'C'], { subs: [[1, 'up', 'O', 2], [1, 'right', 'H']], label: T`Ethanal` }), T`aldehyde: ethanal`], [dispMol(['C', 'C', 'C'], { subs: [[1, 'up', 'O', 2]], label: T`Propanone` }), T`ketone: propanone`], [dispMol(['C', 'C'], { subs: [[1, 'up', 'O', 2], [1, 'right', 'OH']], label: T`Ethanoic acid` }), T`carboxylic acid: ethanoic acid`], [dispMol(['C', 'C', 'O', 'C'], { subs: [[1, 'up', 'O', 2]], label: T`Methyl ethanoate` }), T`ester: methyl ethanoate`], [dispMol(['C', 'C'], { subs: [[1, 'right', 'NH₂']], label: T`Ethylamine` }), T`amine: ethylamine`]], T`Common functional groups, each shown on a small molecule.`)}
${Tbl([T`Family`, T`Group`, T`Suffix / prefix`, T`Example`], [[T`alcohol`, '–OH', '-ol', T`ethanol $\ce{C2H5OH}$`], [T`haloalkane`, '–F, –Cl, –Br, –I', T`fluoro-, chloro-, bromo-, iodo-`, T`chloromethane $\ce{CH3Cl}$`], [T`aldehyde`, '–CHO', '-al', T`ethanal $\ce{CH3CHO}$`], [T`ketone`, 'C–CO–C', '-one', T`propanone $\ce{CH3COCH3}$`], [T`carboxylic acid`, '–COOH', T`-oic acid`, T`ethanoic acid $\ce{CH3COOH}$`], [T`ester`, '–COO–', T`alkyl -oate`, T`ethyl ethanoate $\ce{CH3COOC2H5}$`], [T`ether`, 'C–O–C', T`alkoxy-`, T`methoxymethane $\ce{CH3OCH3}$`], [T`amine`, '–NH₂', T`-amine`, T`ethylamine $\ce{C2H5NH2}$`], [T`amide`, '–CONH₂', '-amide', T`ethanamide $\ce{CH3CONH2}$`]])}
${Key(T`<p>Groups that can form hydrogen bonds (–OH, –COOH, –NH₂) raise boiling points and water solubility: ethanol ($M_r$ 46) boils at 78 °C, propane ($M_r$ 44) at −42 °C. Solubility falls as the hydrocarbon chain gets longer. Carboxylic acids are weak acids; amines are weak bases.</p>`)}

{
  id: 'isomerism', stage: 'sh', title: 'Isomerism',
  blurb: 'Structural isomers (chain, position, functional group) and stereoisomers: cis/trans (E/Z) isomers of alkenes and optical isomers with a chiral carbon.',
  lesson: () => T`
<p><b>Isomers</b> have the same molecular formula but a different arrangement of atoms. They can have quite different properties.</p>
${FigRow([[dispMol(['C', 'C', 'C', 'C'], { label: T`Butane` }), T`butane (b.p. −0.5 °C)`], [dispMol(['C', 'C', 'C'], { subs: [[1, 'down', 'CH₃']], label: T`Methylpropane` }), T`2-methylpropane (b.p. −11.7 °C)`]], T`Chain isomers of $\ce{C4H10}$. The branched isomer is more compact, has less surface contact and therefore a lower boiling point.`)}
${Tbl([T`Type`, T`What differs`, T`Example`], [[T`chain`, T`the carbon skeleton (branching)`, T`butane / 2-methylpropane`], [T`position`, T`the position of the functional group`, T`propan-1-ol / propan-2-ol`], [T`functional group`, T`the functional group itself`, T`ethanol / methoxymethane ($\ce{C2H6O}$); propanal / propanone`]])}
<h3>Stereoisomers</h3>

${Key(T`<p>A carbon atom bonded to four <b>different</b> groups is <b>chiral</b>. Its two mirror-image forms cannot be superimposed, like left and right hands: they are <b>optical isomers</b> (enantiomers). They rotate plane-polarised light in opposite directions and can act very differently in the body: one form of carvone smells of spearmint, the other of caraway.</p>`)}
${FigRow([[shapeSvg('tetrahedral', { centre: 'C', outer: 'X', W: 170, H: 170, label: T`A chiral carbon with four different groups` }).replace(/class="ch-bX"/g, (m, i) => m).replace(/(<circle[^>]*class=")ch-bX(")/, '$1ch-bO$2').replace(/(<circle[^>]*class=")ch-bX(")/, '$1ch-bN$2').replace(/(<circle[^>]*class=")ch-bX(")/, '$1ch-bS$2'), T`one enantiomer`], [shapeSvg('tetrahedral', { centre: 'C', outer: 'X', W: 170, H: 170, label: T`Its mirror image` }).replace(/(<circle[^>]*class=")ch-bX(")/, '$1ch-bO$2').replace(/(<circle[^>]*class=")ch-bX(")/, '$1ch-bN$2').replace(/(<circle[^>]*class=")ch-bX(")/, '$1ch-bS$2').replace('<svg ', '<svg style="transform:scaleX(-1)" '), T`its mirror image`]], T`Four different groups (four colours) around a carbon: the molecule and its mirror image are not the same, however you turn them.`)}

  blurb: 'A first step into university chemistry: hybridisation and molecular orbital theory, entropy and Gibbs energy, the Arrhenius equation and mechanisms, spectroscopy for identifying compounds, and crystal-field theory.',
  topics: [
{
  id: 'molecular-orbitals', stage: 'uni', title: 'Hybridisation & Molecular Orbital Theory',
  blurb: 'sp³, sp² and sp hybrid orbitals, σ and π bonds, molecular orbitals from atomic orbitals, MO diagrams of diatomic molecules, bond order and magnetism.',
  lesson: () => T`
<p>Carbon has only two unpaired electrons ($2s^2\,2p^2$), yet methane has four identical C–H bonds at 109.5°. <b>Hybridisation</b> explains this: the $2s$ and $2p$ orbitals mix into new, equivalent <b>hybrid orbitals</b>.</p>
${Tbl([T`Hybrid`, T`Mixed from`, T`Number`, T`Geometry`, T`Example`], [['sp³', 's + 3p', '4', T`tetrahedral, 109.5°`, T`$\ce{CH4}$, diamond`], ['sp²', 's + 2p', '3 (+1 p left)', T`trigonal planar, 120°`, T`$\ce{C2H4}$, graphite, benzene`], ['sp', 's + p', '2 (+2 p left)', T`linear, 180°`, T`$\ce{C2H2}$, $\ce{CO2}$`]])}
${Key(T`<p>Head-on overlap of orbitals gives a <b>σ bond</b> (electron density along the axis); side-on overlap of parallel p orbitals gives a <b>π bond</b> (density above and below the axis). A single bond is σ; a double bond is σ + π; a triple bond is σ + 2π. π bonds prevent rotation (cis/trans isomers).</p>`)}
<h3>Molecular orbitals</h3>
<p>In <b>MO theory</b> atomic orbitals combine into molecular orbitals spread over the whole molecule: an in-phase <b>bonding</b> MO (lower energy) and an out-of-phase <b>antibonding</b> MO (*, higher energy). Electrons fill the MOs by the aufbau principle, Pauli and Hund.</p>
${Fig(moDiagramSvg(12, { names: [T`atom`], label: T`Molecular orbital diagram of oxygen: two unpaired electrons in the pi-star orbitals` }), T`MO diagram of $\ce{O2}$ (12 valence electrons). The last two electrons go singly into the two π*2p orbitals, so $\ce{O2}$ has two unpaired electrons: it is <b>paramagnetic</b> (liquid oxygen sticks to a magnet), which the Lewis structure O=O cannot explain.`)}
${Key(T`<p>$$\text{bond order} = \frac{(\text{bonding electrons}) - (\text{antibonding electrons})}{2}$$ $\ce{O2}$: $\frac{8 - 4}{2} = 2$; $\ce{N2}$: 3; $\ce{He2}$: 0, so it does not exist. A higher bond order means a shorter, stronger bond.</p>`)}
${Tip(T`<p>For $\ce{B2}$, $\ce{C2}$ and $\ce{N2}$ the σ2p orbital lies above the π2p pair (s–p mixing); from $\ce{O2}$ on, σ2p lies below. This is why $\ce{B2}$ is paramagnetic.</p>`)}`,
  gens: [
    () => { const [f, h] = pick([['CH4', 'sp³'], ['C2H4', 'sp²'], ['C2H2', 'sp'], ['BF3', 'sp²'], ['CO2 (C)', 'sp'], ['NH3 (N)', 'sp³'], ['H2O (O)', 'sp³'], ['C6H6', 'sp²'], ['BeCl2', 'sp']]); return { q: T`What is the hybridisation of the central atom in $\ce{${f.split(' ')[0]}}$${f.includes('(') ? ' ' + f.split(' ')[1] : ''}?`, a: h, w: ['sp³', 'sp²', 'sp', 'sp³d'].filter(x => x !== h), only: 'mc', s: T`Count electron domains: 4 → sp³, 3 → sp², 2 → sp. Here: <b>${h}</b>.` }; },
    () => { const [f, sg, pi] = pick([['C2H6', 7, 0], ['C2H4', 5, 1], ['C2H2', 3, 2], ['CO2', 2, 2], ['N2', 1, 2], ['HCN', 2, 2], ['C3H6 (propene)', 8, 1]]), ask = chance(); return ask ? { q: T`How many σ bonds are in $\ce{${f.split(' ')[0]}}$?`, a: sg, w: [sg + pi, sg - 1, sg + 1].filter((x, i, a) => x !== sg && x >= 0 && a.indexOf(x) === i), s: T`Each bond has one σ; double and triple bonds add π bonds: ${sg} σ and ${pi} π.` } : { q: T`How many π bonds are in $\ce{${f.split(' ')[0]}}$?`, a: pi, w: [0, 1, 2, 3].filter(x => x !== pi), s: T`${sg} σ and ${pi} π.` }; },
    () => { const [f, n, bo] = pick(DIAT); return { q: T`Use MO theory: what is the bond order of $\ce{${f}}$ (${n} valence electrons)?`, a: bo, w: [0, 1, 2, 3].filter(x => x !== bo), s: T`Fill the MOs with ${n} electrons; (bonding − antibonding)/2 = <b>${bo}</b>.` }; },
    () => { const [f, , , para] = pick(DIAT.filter(x => x[0] !== 'Ne2')); return { q: T`Is $\ce{${f}}$ paramagnetic (unpaired electrons) or diamagnetic?`, a: para ? T`paramagnetic` : T`diamagnetic`, w: [para ? T`diamagnetic` : T`paramagnetic`], only: 'mc', s: para ? T`Its highest occupied level is a degenerate π pair with one electron in each: <b>paramagnetic</b>.` : T`All electrons are paired: <b>diamagnetic</b>.` }; },
    () => { const [a, b] = [['O2+', 2.5], ['O2', 2], ['O2-', 1.5], ['O2^2-', 1]].sort(() => rng() - 0.5).slice(0, 2); return { q: T`Which has the stronger O–O bond: $\ce{${a[0]}}$ or $\ce{${b[0]}}$?`, a: `$\\ce{${a[1] > b[1] ? a[0] : b[0]}}$`, w: [`$\\ce{${a[1] > b[1] ? b[0] : a[0]}}$`, T`they are equal`], only: 'mc', s: T`Bond orders: $\ce{${a[0]}}$ ${NUM(a[1])}, $\ce{${b[0]}}$ ${NUM(b[1])}. Higher bond order, stronger bond. (Removing an electron from π* raises the bond order.)` }; },
  ],
},
{
  id: 'chemical-thermodynamics', stage: 'uni', title: 'Entropy, Gibbs Energy & Spontaneity',
  blurb: 'Entropy and the second law, standard entropies, Gibbs free energy ΔG = ΔH − TΔS, the temperature of spontaneity, ΔG° = −RT ln K, ΔG° = −nFE°, and the Nernst equation.',
  lesson: () => T`
<p>Why do some reactions happen by themselves and others not? Energy (enthalpy) is only half the answer; the other half is <b>entropy</b> $S$, a measure of how many ways the particles and their energy can be arranged ("disorder"). The <b>second law</b>: in a spontaneous process the total entropy of the universe increases.</p>
${Key(T`<p>Entropy increases: solid → liquid → gas; dissolving; more gas molecules produced; higher temperature. $$\Delta S^\circ = \sum S^\circ(\text{products}) - \sum S^\circ(\text{reactants}) \quad (\mathrm{J\,K^{-1}\,mol^{-1}})$$ The <b>Gibbs free energy</b> combines both: $$\Delta G = \Delta H - T\Delta S$$ A reaction is spontaneous (feasible) when $\Delta G < 0$.</p>`)}
${Fig(planeSvg({ W: 420, H: 260, x: [0, 1250], y: [-120, 120], step: [100, 40], tickX: 300, tickY: 40, xl: 'T (K)', yl: 'ΔG (kJ)', fns: [{ f: T0 => 178 - T0 * 0.161, from: 0, to: 1080, cls: 'mf-c1', label: 'CaCO₃ → CaO + CO₂', at: 830, dx: 8, dy: -6 }, { f: T0 => -92 + T0 * 0.199, from: 0, to: 1080, cls: 'mf-c4', label: 'N₂ + 3H₂ → 2NH₃', at: 250, dx: 14, dy: 22 }], pts: [[1106, 0, '', 'end'], [462, 0, '', 'end']], texts: [[1240, -40, T`feasible above 1106 K`, 'end', 'mf-small'], [230, -100, T`feasible below 462 K`, 'middle', 'mf-small']], label: T`Gibbs energy against temperature for decomposing limestone, which becomes feasible above about 1100 kelvin, and for making ammonia, feasible below about 460 kelvin` }), T`$\Delta G = \Delta H - T\Delta S$ is a straight line in $T$ with slope $-\Delta S$. Limestone ($\Delta H = +178$ kJ, $\Delta S = +161$ J/K) decomposes only above $T = \frac{\Delta H}{\Delta S} \approx 1106$ K; ammonia synthesis ($\Delta H = -92$ kJ, $\Delta S = -199$ J/K) is feasible only below about 462 K (values from standard data tables).`)}
${Tbl(['ΔH', 'ΔS', 'ΔG', T`Spontaneous?`], [['−', '+', T`always −`, T`at all temperatures`], ['+', '−', T`always +`, T`never`], ['−', '−', T`− at low T`, T`at low temperature`], ['+', '+', T`− at high T`, T`at high temperature`]])}
${Key(T`<p>Links to equilibrium and electrochemistry: $$\Delta G^\circ = -RT\ln K \qquad \Delta G^\circ = -nFE^\circ_{\text{cell}}$$ and the <b>Nernst equation</b> for non-standard concentrations: $$E = E^\circ - \frac{RT}{nF}\ln Q \;=\; E^\circ - \frac{0.0592}{n}\log Q \ (25\ °\mathrm{C})$$</p>`)}
${Tip(T`<p>"Spontaneous" says nothing about speed: diamond turning into graphite has $\Delta G < 0$ but is immeasurably slow. Thermodynamics says <i>whether</i>, kinetics says <i>how fast</i>.</p>`)}`,
  gens: [
    () => { const H = pick([-92, 178, -286, 52, -57, 131]), S = pick([-199, 161, -163, 134, 80, -120]), T0 = pick([298, 500, 1000, 400]), G = sig(H - T0 * S / 1000, 3); return { q: T`$\Delta H = ${M(H)}$ kJ and $\Delta S = ${M(S)}$ J/K. Find $\Delta G$ (in kJ) at ${T0} K.`, a: G, u: 'kJ', rtol: 0.01, w: [sig(H - T0 * S, 3), sig(H + T0 * S / 1000, 3), sig(S - T0 * H / 1000, 3)], s: T`$\Delta G = ${M(H)} - ${T0} \times (${M(S / 1000)}) = ${M(G)}$ kJ (convert $\Delta S$ to kJ/K!).` }; },
    () => { const H = pick([178, 131, 90, 206, 44]), S = pick([161, 134, 120, 215, 118]), T0 = sig(H * 1000 / S, 3); return { q: T`An endothermic reaction has $\Delta H = +${H}$ kJ and $\Delta S = +${S}$ J/K. Above what temperature (in K) is it feasible?`, a: T0, u: 'K', rtol: 0.01, w: [sig(H / S, 3), sig(S * 1000 / H, 3), sig(T0 - 273, 3)], s: T`$\Delta G = 0$ at $T = \frac{\Delta H}{\Delta S} = \frac{${H}\,000}{${S}} = ${M(T0)}$ K.` }; },
    () => { const [p, a] = pick([[T`water freezing`, '−'], [T`ice melting`, '+'], [T`$\ce{CaCO3(s) -> CaO(s) + CO2(g)}$`, '+'], [T`$\ce{N2(g) + 3H2(g) -> 2NH3(g)}$`, '−'], [T`salt dissolving in water`, '+'], [T`steam condensing`, '−'], [T`$\ce{2H2O2(l) -> 2H2O(l) + O2(g)}$`, '+']]); return { q: T`Is $\Delta S$ positive or negative for ${p}?`, a: a === '+' ? T`positive` : T`negative`, w: [a === '+' ? T`negative` : T`positive`], only: 'mc', s: a === '+' ? T`More disorder (more gas, or solid → liquid): <b>positive</b>.` : T`Less disorder: <b>negative</b>.` }; },
    () => { const K = pick([10, 100, 1e5, 0.01, 1e-3]), T0 = 298, G = sig(-R * T0 * Math.log(K) / 1000, 3); return { q: T`At 298 K, $K = ${K >= 1e4 || K < 0.01 ? sciT(K, 1) : M(K)}$. What is $\Delta G^\circ$ (in kJ/mol)? ($R = 8.314$)`, a: G, u: 'kJ/mol', rtol: 0.01, w: [-G, sig(-R * T0 * Math.log10(K) / 1000, 3), sig(G * 1000, 3)], s: T`$\Delta G^\circ = -RT\ln K = -8.314 \times 298 \times \ln(${M(K)}) = ${M(G)}$ kJ/mol.` }; },
    () => { const [n, E] = pick([[2, 1.10], [2, 0.46], [1, 0.80], [2, 3.17], [6, 1.21]]), G = sig(-n * F * E / 1000, 3); return { q: T`A cell reaction transfers ${n} mol of electrons and has $E^\circ = ${M(E)}$ V. What is $\Delta G^\circ$ (in kJ)? ($F = 96\,485$ C/mol)`, a: G, u: 'kJ', rtol: 0.01, w: [-G, sig(-F * E / 1000, 3) === G ? sig(G * 2, 3) : sig(-F * E / 1000, 3), sig(-n * F * E, 3)], s: T`$\Delta G^\circ = -nFE^\circ = -${n} \times 96\,485 \times ${M(E)} = ${M(G)}$ kJ.` }; },
    () => { const Q0 = pick([10, 100, 0.1, 0.01, 1000]), n = pick([1, 2]), E0 = 1.10, E = sig(E0 - 0.0592 / n * Math.log10(Q0), 3); return { q: T`A cell has $E^\circ = 1.10$ V and $n = ${n}$. What is $E$ (in V) when $Q = ${M(Q0)}$ at 25 °C?`, a: E, u: 'V', rtol: 0.005, w: [sig(E0 + 0.0592 / n * Math.log10(Q0), 3), E0, sig(E0 - 0.0592 * Math.log10(Q0), 3) === E ? sig(E + 0.1, 3) : sig(E0 - 0.0592 * Math.log10(Q0), 3)], s: T`$E = 1.10 - \frac{0.0592}{${n}}\log ${M(Q0)} = ${M(E)}$ V.` }; },
  ],
},
{
  id: 'advanced-kinetics', stage: 'uni', title: 'Arrhenius Equation & Reaction Mechanisms',
  blurb: 'The Arrhenius equation, activation energy from an Arrhenius plot, integrated rate laws for zero-, first- and second-order reactions, reaction mechanisms, elementary steps and the rate-determining step.',
  lesson: () => T`
<p>The rate constant depends strongly on temperature. Svante Arrhenius (1889) found:</p>
${Fm(T`k = A\,e^{-E_a/RT} \qquad \ln k = \ln A - \frac{E_a}{R}\cdot\frac{1}{T}`)}
<p>$A$ is the pre-exponential (frequency) factor; $e^{-E_a/RT}$ is the fraction of collisions with enough energy. A plot of $\ln k$ against $1/T$ is a straight line with gradient $-E_a/R$.</p>
${Fig(planeSvg({ W: 420, H: 250, x: [1.5, 4.2], y: [0, 10.5], step: [0.5, 2], tickX: 0.5, tickY: 2, xl: '1/T (10⁻³ K⁻¹)', yl: 'ln k', fns: [{ f: x => 22 - 6.5 * x, from: 1.9, to: 3.25, cls: 'mf-c1' }], pts: [[2.0, 9], [2.4, 6.4], [2.8, 3.8], [3.2, 1.2]], segs: [[2.0, 9, 3.2, 9, 'mf-c4', true], [3.2, 9, 3.2, 1.2, 'mf-c4', true]], texts: [[2.75, 9.5, T`gradient = −Eₐ/R`, 'middle', 'mf-small']], label: T`Arrhenius plot: the natural log of k against one over T is a straight line with negative slope` }), T`An Arrhenius plot. Here the gradient is $-6.5 \times 10^{3}$ K, so $E_a = 6.5 \times 10^3 \times 8.314 = 54$ kJ/mol. The two-temperature form is $\ln\frac{k_2}{k_1} = \frac{E_a}{R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right)$.`)}
${Tbl([T`Order`, T`Integrated rate law`, T`Straight-line plot`, T`Half-life`], [['0', '$[A] = [A]_0 - kt$', '$[A]$ vs $t$', '$\\frac{[A]_0}{2k}$'], ['1', '$\\ln[A] = \\ln[A]_0 - kt$', '$\\ln[A]$ vs $t$', '$\\frac{\\ln 2}{k}$'], ['2', '$\\frac{1}{[A]} = \\frac{1}{[A]_0} + kt$', '$\\frac{1}{[A]}$ vs $t$', '$\\frac{1}{k[A]_0}$']])}
${Key(T`<p>Most reactions happen in a series of <b>elementary steps</b>: the <b>mechanism</b>. The slowest step is the <b>rate-determining step</b>; the rate equation contains only the species in (or before) that step. Example: $\ce{NO2 + CO -> NO + CO2}$ has rate $= k[\ce{NO2}]^2$ because the slow step is $\ce{2NO2 -> NO3 + NO}$, followed by the fast $\ce{NO3 + CO -> NO2 + CO2}$. $\ce{NO3}$ is an <b>intermediate</b>: made in one step, used in the next.</p>`)}
${Tip(T`<p>A catalyst provides a different mechanism with a lower-energy rate-determining step. Enzymes follow Michaelis–Menten kinetics: the rate levels off when every active site is busy.</p>`)}`,
  gens: [
    () => { const Ea = pick([50, 75, 100, 40]) * 1000, T1 = 300, T2 = pick([310, 320, 350]), r = sig(Math.exp(Ea / R * (1 / T1 - 1 / T2)), 3); return { q: T`$E_a = ${Ea / 1000}$ kJ/mol. By what factor does $k$ increase from 300 K to ${T2} K? ($R = 8.314$)`, a: r, rtol: 0.02, w: [sig(T2 / T1, 3), sig(r * 2, 3), sig(Math.exp(Ea / R * (1 / T1 - 1 / T2)) / 10, 3)], s: T`$\ln\frac{k_2}{k_1} = \frac{${Ea}}{8.314}\left(\frac{1}{300} - \frac{1}{${T2}}\right) = ${M(sig(Math.log(r), 3))}$, so $\frac{k_2}{k_1} = ${M(r)}$.` }; },
    () => { const g = pick([-4000, -6500, -8000, -12000]), Ea = sig(-g * R / 1000, 3); return { q: T`An Arrhenius plot of $\ln k$ against $1/T$ has a gradient of $${M(g)}$ K. What is $E_a$ (in kJ/mol)?`, a: Ea, u: 'kJ/mol', rtol: 0.01, w: [sig(-g / R / 1000, 3), sig(-g * R, 3), sig(Ea / 2.303, 3)], s: T`$E_a = -\text{gradient} \times R = ${M(-g)} \times 8.314 = ${M(sig(-g * R, 4))}$ J/mol $= ${M(Ea)}$ kJ/mol.` }; },
    () => { const k = pick([0.05, 0.1, 0.02]), A0 = pick([1, 0.5, 2]), t = pick([10, 20, 30]), A = sig(A0 * Math.exp(-k * t), 3); return { q: T`A first-order reaction has $k = ${M(k)}$ min⁻¹ and $[A]_0 = ${M(A0)}$ M. What is $[A]$ (in M) after ${t} min?`, a: A, u: 'M', rtol: 0.01, w: [sig(A0 - k * t, 3) > 0 ? sig(A0 - k * t, 3) : sig(A / 2, 3), sig(1 / (1 / A0 + k * t), 3), sig(A0 * Math.exp(-k / t), 3)], s: T`$[A] = [A]_0 e^{-kt} = ${M(A0)} e^{-${M(sig(k * t, 3))}} = ${M(A)}$ M.` }; },
    () => { const [o, p] = pick([[0, T`[A] against t`], [1, T`ln[A] against t`], [2, T`1/[A] against t`]]); return { q: T`Which plot gives a straight line for a reaction of order ${o} in A?`, a: p, w: [T`[A] against t`, T`ln[A] against t`, T`1/[A] against t`].filter(x => x !== p), only: 'mc', s: T`<b>${p}</b>.` }; },
    () => pick([
      { q: T`Step 1: 2NO₂ → NO₃ + NO (slow). Step 2: NO₃ + CO → NO₂ + CO₂ (fast). What is the rate equation?`, a: T`rate = k[NO₂]²`, w: [T`rate = k[NO₂][CO]`, T`rate = k[NO₃][CO]`, T`rate = k[CO]`], only: 'mc', s: T`Only the species in the slow (rate-determining) step appear.` },
      { q: T`In a mechanism, what is an intermediate?`, a: T`A species made in one step and used up in a later step`, w: [T`The catalyst`, T`The slowest step`, T`The final product`], only: 'mc', s: T`It does not appear in the overall equation.` },
    ]),
  ],
},
{
  id: 'spectroscopy', stage: 'uni', title: 'Spectroscopy & Structure Determination',
  blurb: 'Mass spectrometry (molecular ion, fragments), infrared spectroscopy (bond vibrations), ¹H NMR (chemical shift, integration, splitting) and UV–visible spectroscopy with the Beer–Lambert law.',
  lesson: () => T`
<p>Modern chemists identify compounds from how they interact with energy. Each technique gives a different clue.</p>
${Fig(spectrumSvg([[15, 12, ''], [29, 25, '29'], [31, 100, '31'], [45, 50, ''], [46, 22, '45, 46 (M⁺)']], { lines: true, x0: 10, x1: 50, xl: T`mass/charge (m/z)`, ticks: [10, 20, 30, 40, 50], H: 200, label: T`Mass spectrum of ethanol: molecular ion at 46 and a base peak at 31` }), T`<b>Mass spectrum</b> of ethanol (NIST data, simplified). The molecular ion $\ce{M+}$ at $m/z$ 46 gives the $M_r$; fragments show pieces: 31 is $\ce{CH2OH+}$ (the tallest, base peak), 45 is $\ce{M - H}$, 29 is $\ce{C2H5+}$.`)}
${Fig(spectrumSvg([[3350, 70, 'O–H', 180], [2970, 45, 'C–H', 60], [1050, 60, 'C–O', 30], [1380, 20, '', 25]], { dips: true, reverse: true, x0: 600, x1: 4000, xl: T`wavenumber (cm⁻¹)`, ticks: [4000, 3000, 2000, 1500, 1000], H: 200, label: T`Infrared spectrum of ethanol with a broad O–H dip near 3350, C–H near 2970 and C–O near 1050 wavenumbers` }), T`<b>Infrared spectrum</b> of ethanol (schematic). Bonds absorb IR at characteristic wavenumbers: broad O–H (alcohol) 3200–3550, C–H 2850–3000, C=O 1680–1750 (sharp, strong), C–O 1000–1300 cm⁻¹. Below 1500 cm⁻¹ is the unique "fingerprint region".`)}
${Fig(spectrumSvg([[1.22, 60, 'CH₃ (3H, t)', 0.02], [1.18, 30, '', 0.02], [1.26, 30, '', 0.02], [3.69, 25, 'CH₂ (2H, q)', 0.02], [3.64, 15, '', 0.02], [3.74, 15, '', 0.02], [3.60, 5, '', 0.02], [3.78, 5, '', 0.02], [2.6, 25, 'OH (1H, s)', 0.03]], { reverse: true, x0: 0, x1: 5, xl: T`chemical shift δ (ppm)`, ticks: [5, 4, 3, 2, 1, 0], H: 210, label: T`Proton NMR spectrum of ethanol: a triplet near 1.2, a singlet near 2.6 and a quartet near 3.7 ppm` }), T`<b>¹H NMR spectrum</b> of ethanol (schematic). Three environments give three signals; their areas are in the ratio 3 : 1 : 2. By the <b>n + 1 rule</b>, the $\ce{CH3}$ next to a $\ce{CH2}$ is split into a triplet, the $\ce{CH2}$ next to $\ce{CH3}$ into a quartet. The OH proton usually appears as a singlet.`)}
${Key(T`<p><b>UV–visible spectroscopy</b> measures how much light a coloured solution absorbs. The <b>Beer–Lambert law</b>: $$A = \varepsilon\,c\,l$$ absorbance = molar absorptivity × concentration × path length (usually 1 cm). A calibration line of $A$ against $c$ for standard solutions gives the concentration of an unknown.</p>`)}
${Tip(T`<p>Summary of what each gives: MS → molar mass and fragments; IR → functional groups; NMR → the carbon–hydrogen skeleton; UV–vis → concentration and conjugation. X-ray crystallography gives the full 3-D structure.</p>`)}`,
  gens: [
    () => { const [b, r] = pick([['O–H (alcohol)', '3200–3550'], ['C=O', '1680–1750'], ['C–H', '2850–3000'], ['C≡N', '2220–2260'], ['N–H', '3300–3500'], ['C=C', '1620–1680']]); return { q: T`In which region (cm⁻¹) does the ${b} bond absorb in an IR spectrum?`, a: r, w: ['3200–3550', '1680–1750', '2850–3000', '2220–2260', '1620–1680', '1000–1300'].filter(x => x !== r).sort(() => rng() - 0.5).slice(0, 3), only: 'mc', s: T`<b>${r}</b> cm⁻¹.` }; },

    () => { const [f, e] = pick([['CH3CH2OH', 3], ['CH3OCH3', 1], ['CH3CH2CH3', 2], ['CH3COCH3', 1], ['CH3CH2Cl', 2], ['CH3COOCH2CH3', 3], ['C6H6', 1], ['CH3CHO', 2]]); return { q: T`How many different ¹H environments (NMR signals) does $\ce{${f}}$ have?`, a: e, w: [1, 2, 3, 4, 5].filter(x => x !== e).slice(0, 3), s: T`Count hydrogens in different surroundings: <b>${e}</b>.` }; },

{
  id: 'crystal-field', stage: 'uni', title: 'Crystal-Field Theory & Coordination Chemistry',
  blurb: 'Naming complexes, isomerism in complexes, d-orbital splitting in octahedral and tetrahedral fields, the spectrochemical series, high- and low-spin complexes, colour and magnetism.',
  lesson: () => T`
<p>In a free metal ion the five $d$ orbitals have the same energy. In an octahedral complex the ligands approach along the $x$, $y$ and $z$ axes and repel the two orbitals pointing at them ($d_{x^2-y^2}$, $d_{z^2}$: the $e_g$ set) more than the three pointing between them ($d_{xy}$, $d_{xz}$, $d_{yz}$: $t_{2g}$). The gap is the <b>crystal-field splitting</b> $\Delta_o$.</p>
${FigRow([[crystalFieldSvg(6, { names: [T`free ion`, T`high spin (weak field)`], label: T`High-spin d6: four unpaired electrons` }), T`$d^6$ high spin: 4 unpaired`], [crystalFieldSvg(6, { low: true, names: [T`free ion`, T`low spin (strong field)`], label: T`Low-spin d6: all six electrons paired in the lower level` }), T`$d^6$ low spin: 0 unpaired`]], T`Iron(II), $d^6$. With weak-field ligands ($\ce{H2O}$) the gap is small and electrons spread out before pairing (high spin, paramagnetic). With strong-field ligands ($\ce{CN-}$) pairing costs less than jumping the gap (low spin, diamagnetic): $\ce{[Fe(CN)6]^4-}$.`)}
${Key(T`<p><b>Spectrochemical series</b> (weak → strong field): $$\ce{I- < Br- < Cl- < F- < OH- < H2O < NH3 < en < CN- < CO}$$ A larger $\Delta_o$ means the complex absorbs higher-energy (shorter-wavelength) light: $\ce{[Cu(H2O)6]^2+}$ is pale blue, $\ce{[Cu(NH3)4(H2O)2]^2+}$ deep violet-blue. In tetrahedral complexes the splitting is reversed and smaller ($\Delta_t \approx \frac{4}{9}\Delta_o$), so they are almost always high spin.</p>`)}
${Tbl([T`Rule`, T`Example`], [[T`name the ligands first, in alphabetical order, with di-, tri-, tetra-, hexa-`, T`tetraammine…`], [T`anionic ligands end in -o: chlorido, cyanido, hydroxido; water = aqua, NH₃ = ammine`, T`hexaaqua…`], [T`then the metal with its oxidation state in Roman numerals`, T`hexaaquacopper(II)`], [T`in an anionic complex the metal ends in -ate`, T`$\ce{[Fe(CN)6]^4-}$: hexacyanidoferrate(II)`]])}
${Tip(T`<p>Square planar complexes such as <i>cis</i>-$\ce{[PtCl2(NH3)2]}$ (cisplatin, an anti-cancer drug) show cis/trans isomerism; octahedral complexes with bidentate ligands like ethane-1,2-diamine (en) can be optically active.</p>`)}`,
  gens: [
    () => { const [c, d] = pick([['[Fe(H2O)6]^2+', 6], ['[Fe(H2O)6]^3+', 5], ['[Cu(H2O)6]^2+', 9], ['[Co(NH3)6]^3+', 6], ['[Cr(H2O)6]^3+', 3], ['[Ni(NH3)6]^2+', 8], ['[Mn(H2O)6]^2+', 5], ['[Zn(H2O)6]^2+', 10], ['[Ti(H2O)6]^3+', 1]]); return { q: T`How many d electrons does the metal ion in $\ce{${c}}$ have?`, a: d, w: [d + 2, Math.max(0, d - 1), d + 1].filter((x, i, a) => x !== d && x <= 10 && a.indexOf(x) === i), s: T`Find the oxidation state, then count: group number − charge = <b>${d}</b> d electrons.` }; },

/* Fun facts for the home page (Chemistry). Indonesian versions, in the same order, are in src/lang/id/facts.js. */
const FACTS = [
  { t: `Graphene was made with sticky tape`, b: `In 2004 Andre Geim and Konstantin Novoselov at the University of Manchester used ordinary sticky tape to peel thinner and thinner flakes from a lump of graphite, until they had graphene, a sheet of carbon just one atom thick. It is about 200 times stronger than steel and conducts electricity extremely well. They won the 2010 Nobel Prize in Physics.` },
  { t: `A Nobel Prize and an Ig Nobel Prize`, b: `Andre Geim, co-discoverer of graphene, is the only person to have won both a Nobel Prize (2010) and an Ig Nobel Prize, which honours research that "makes people laugh, then think". His Ig Nobel came in 2000 for using a very strong magnetic field to levitate a live frog, which works because water in the frog is weakly repelled by magnets.` },
  { t: `Mendeleev left gaps and was proved right`, b: `When Dmitri Mendeleev published his periodic table in 1869, he left gaps and predicted the properties of elements not yet discovered. Gallium (1875), scandium (1879) and germanium (1886) were soon found with almost exactly the atomic masses, densities and compounds he had forecast. Element 101, mendelevium, is named after him.` },
  { t: `The newest elements`, b: `The periodic table now has 118 confirmed elements. The four newest were named in 2016: nihonium (113, after Japan, Nihon), moscovium (115, after Moscow), tennessine (117, after Tennessee) and oganesson (118). They were made by smashing lighter nuclei together, and only a handful of atoms, each lasting a fraction of a second, have ever existed.` },
  { t: `An element named after a living scientist`, b: `Oganesson, element 118, is named after the Russian physicist Yuri Oganessian, who led the teams that made many superheavy elements. He is only the second person to have an element named after him while still alive; the first was Glenn Seaborg, honoured by seaborgium (106) in 1997.` },
  { t: `Helium was found in the Sun before the Earth`, b: `During a solar eclipse in 1868, astronomers saw a bright yellow line in the spectrum of the Sun that matched no known element. Norman Lockyer named the new element helium, from the Greek helios, "sun". It was not found on Earth until 1895, when William Ramsay detected it in gas released from a uranium mineral.` },
  { t: `Only two elements are liquid at room temperature`, b: `At normal room temperature, only mercury and bromine are liquids. But gallium melts at 29.8 °C, so it turns to liquid in your hand, and a gallium spoon will melt in a cup of hot tea. Caesium melts at about 28 °C, but it reacts so violently with air and water that it must be kept sealed.` },
  { t: `Diamonds can burn`, b: `Diamond is pure carbon, just like graphite and soot. In 1772 Antoine Lavoisier focused sunlight with a giant lens onto a diamond in a sealed jar and showed that it burns and produces carbon dioxide. At ordinary pressure diamond is actually slightly less stable than graphite, but the change is so slow that "diamonds are forever" is safe in practice.` },
  { t: `The father of modern chemistry lost his head`, b: `Antoine Lavoisier showed that mass is conserved in chemical reactions, named oxygen and hydrogen, and helped create the modern system of chemical names. He was also a tax collector, and during the French Revolution he was guillotined in 1794. The mathematician Lagrange said: "It took them only an instant to cut off that head, and a hundred years may not produce another like it."` },
  { t: `Oxygen's name is a mistake`, b: `Lavoisier named oxygen from Greek words meaning "acid maker", because he believed every acid contains oxygen. He was wrong: hydrochloric acid, HCl, has none. The element itself was discovered independently by Carl Wilhelm Scheele around 1772 and Joseph Priestley in 1774, before Lavoisier explained its role in burning and breathing.` },
  { t: `Hydrogen is most of the universe`, b: `Hydrogen, the simplest element, makes up about three quarters of all the ordinary matter in the universe by mass, and helium most of the rest. Everything else, including the carbon, oxygen and iron in your body, adds up to only about 2%. On Earth, most hydrogen is locked up in water.` },
  { t: `You are made of star dust`, b: `Almost every element in your body heavier than hydrogen and helium, the carbon in your cells, the oxygen you breathe, the calcium in your bones and the iron in your blood, was forged inside stars that lived and died before the Sun formed. Their explosions scattered these elements into the gas clouds that later made our Solar System.` },
  { t: `Gold comes from colliding neutron stars`, b: `Much of the gold, platinum and other heavy elements in the universe is thought to be made when two neutron stars collide. In 2017 astronomers watched such a collision, first detected as gravitational waves, and saw the glow of freshly made heavy elements, with an estimated several Earth masses of gold and platinum.` },
  { t: `All the gold ever mined would fit in a small cube`, b: `Around 216,000 tonnes of gold have been mined in all of human history. Gold is so dense (19.3 g/cm³) that all of it would fit in a cube only about 22 metres on each side, roughly the height of a seven-storey building. Gold does not rust or tarnish, so most of it is still in use today as jewellery, bars and electronics.` },
  { t: `Aluminium was once more precious than gold`, b: `Aluminium is the most common metal in the Earth's crust, but it is so tightly bound in its ores that it was very hard to extract. In the 1850s it cost more than gold, and Napoleon III reportedly served his most honoured guests on aluminium plates. In 1886 Charles Hall and Paul Héroult independently invented cheap electrolysis, and aluminium became an everyday metal.` },
  { t: `Marie Curie, twice a Nobel laureate`, b: `Marie Curie discovered polonium, named after her homeland Poland, and radium. She is the only person to win Nobel Prizes in two different sciences: physics in 1903 and chemistry in 1911. Her notebooks are still so radioactive that they are kept in lead-lined boxes in Paris, and readers must wear protective clothing.` },
  { t: `More molecules in a glass than glasses in the sea`, b: `A glass of water (250 g) contains about 8 × 10²⁴ water molecules. All the oceans together hold roughly 1.3 billion cubic kilometres of water, about 5 × 10²¹ glassfuls. So there are over a thousand times more molecules in one glass of water than there are glasses of water in all the oceans on Earth.` },
  { t: `Avogadro's number is now exact`, b: `Since 20 May 2019 the Avogadro constant has been fixed at exactly 6.02214076 × 10²³ per mole, and the mole is defined as exactly that many particles. Chemists celebrate Mole Day on 23 October from 6:02 in the morning to 6:02 in the evening, because of the date and time 6:02 10/23.` },
  { t: `Most of your body is oxygen`, b: `By mass, your body is about 65% oxygen, 18% carbon, 10% hydrogen and 3% nitrogen, with calcium, phosphorus and a sprinkling of other elements making up the rest. The oxygen and hydrogen are mostly in water, which makes up around 60% of an adult's body. Yet by number of atoms, hydrogen is by far the most common.` },
  { t: `Argon is more common than carbon dioxide`, b: `Dry air is about 78% nitrogen, 21% oxygen and 0.93% argon. Carbon dioxide, which matters so much for climate, is only about 0.04%. Argon, a noble gas, was discovered in 1894 by Lord Rayleigh and William Ramsay; its name comes from the Greek for "lazy", because it hardly reacts with anything.` },
  { t: `Neon signs are only red-orange`, b: `Pure neon glows red-orange when electricity passes through it. The other colours of "neon" signs come from different gases, such as argon with a little mercury for blue, or from coloured phosphor coatings inside the glass. Neon was discovered in 1898 by William Ramsay and Morris Travers, and its name means "new".` },
  { t: `Bread from air`, b: `The Haber–Bosch process, developed in Germany around 1909–1913, combines nitrogen from the air with hydrogen to make ammonia for fertiliser. It is estimated that about half of the world's population today is fed by crops grown with this synthetic nitrogen. Fritz Haber received the 1918 Nobel Prize in Chemistry, though he is also remembered for developing poison gas in the First World War.` },
  { t: `Teflon was an accident`, b: `In 1938 the chemist Roy Plunkett at DuPont opened a cylinder of a refrigerant gas and found that nothing came out, even though it still weighed the same. The gas had turned into a slippery white solid: polytetrafluoroethylene, PTFE, better known as Teflon. It is so unreactive and slippery that it is used for non-stick pans, and almost nothing sticks to it.` },
  { t: `The first fully synthetic plastic`, b: `In 1907 Leo Baekeland made Bakelite by reacting phenol with formaldehyde. It was the first fully synthetic plastic: hard, heat-resistant and a good electrical insulator, perfect for telephones, radios and light switches. Today the world produces more than 400 million tonnes of plastic every year.` },
  { t: `Nylon stockings caused queues`, b: `Wallace Carothers and his team at DuPont made nylon in 1935, the first synthetic fibre made entirely from chemicals. When nylon stockings went on sale in the USA in 1940, millions of pairs sold in days. During the Second World War nylon was needed for parachutes and ropes, and stockings became so scarce that there were "nylon riots" when they returned.` },
  { t: `Kevlar: stronger than steel`, b: `In 1965 the chemist Stephanie Kwolek at DuPont made a cloudy, runny polymer solution that colleagues wanted to throw away. She insisted on spinning it into fibres, and the result was Kevlar, about five times stronger than steel for the same weight. It is now used in bulletproof vests, helmets, ropes and bicycle tyres.` },
  { t: `Super glue was rejected for being too sticky`, b: `In 1942 Harry Coover was trying to make clear plastic gun sights and found that cyanoacrylates stuck to everything, so the project dropped them. Years later he realised the stickiness was the point, and super glue went on sale in 1958. It sets when traces of water on surfaces start the polymerisation, and it was even used to close wounds.` },
  { t: `A purple accident started the dye industry`, b: `In 1856 the 18-year-old William Perkin was trying to make the malaria drug quinine from coal tar. Instead he got a black sludge that dissolved to give a brilliant purple. He patented it as "mauveine", the first synthetic dye, and made purple, once a colour only the rich could afford, fashionable across Europe.` },
  { t: `Saccharin was found by unwashed hands`, b: `In 1879 Constantin Fahlberg, working on coal-tar chemicals, noticed that his bread tasted remarkably sweet at dinner. He had not washed his hands after work in the lab, and he traced the sweetness back to the compound saccharin, about 300–400 times sweeter than sugar. Tasting chemicals in the lab is extremely dangerous, so do not try this.` },
  { t: `Dynamite and the Nobel Prizes`, b: `Alfred Nobel invented dynamite in 1867 by soaking unstable nitroglycerine into a porous powdery earth called kieselguhr, making it safe to handle. In 1888 a newspaper mistakenly printed his obituary, calling him "the merchant of death". Shocked, Nobel left most of his fortune to fund the prizes that bear his name, first awarded in 1901.` },
  { t: `One village, four elements`, b: `A quarry near the village of Ytterby in Sweden produced minerals from which chemists isolated several new elements in the 19th century. Four of them are named after the village: yttrium, ytterbium, terbium and erbium. No other place on Earth has given its name to so many elements.` },
  { t: `The metal with the highest melting point`, b: `Tungsten melts at 3,422 °C, the highest melting point of any metal, which is why it was used for the glowing filaments of old light bulbs. Its symbol W comes from its other name, wolfram. The densest element of all is osmium, at about 22.6 g/cm³: a litre of it would weigh over 22 kg.` },
  { t: `The "fluorine martyrs"`, b: `Fluorine is the most reactive element, and for decades chemists who tried to isolate it were poisoned or injured; several died. In 1886 Henri Moissan finally made it by electrolysis at low temperature in equipment made of platinum, and he won the 1906 Nobel Prize in Chemistry. Tiny amounts of fluoride in toothpaste help harden tooth enamel.` },
  { t: `Astronauts drank water from their fuel cells`, b: `The Apollo spacecraft got their electricity from hydrogen–oxygen fuel cells. The only waste product was pure water, which the astronauts used for drinking. Fuel cells make electricity directly from a chemical reaction, without burning, and today they power some buses, cars and backup generators.` },
  { t: `Octopuses have blue blood`, b: `Human blood is red because haemoglobin carries oxygen using iron. Octopuses, squid and horseshoe crabs use haemocyanin instead, which contains copper and turns blue when it carries oxygen. Octopuses also have three hearts. In plants, chlorophyll has a magnesium atom at its centre, in a ring structure very similar to the one in haemoglobin.` },
  { t: `Bananas are slightly radioactive`, b: `Bananas are rich in potassium, and a tiny fraction of natural potassium is radioactive potassium-40. Eating a banana gives you a very small dose of radiation, so small that the "banana equivalent dose" is sometimes used to explain radiation levels. Your own body contains about 4,000 decaying potassium-40 atoms every second.` },
  { t: `Carbon-14 tells the age of ancient things`, b: `Living things constantly take in carbon, including a small, steady fraction of radioactive carbon-14. When they die, the carbon-14 decays with a half-life of about 5,730 years and is not replaced. By measuring how much is left, Willard Libby showed in 1949 how to date wood, bone and cloth up to about 50,000 years old, and won the 1960 Nobel Prize in Chemistry.` },
  { t: `From sand to smartphones`, b: `Computer chips are made from silicon, the second most common element in the Earth's crust after oxygen, found in ordinary sand as silicon dioxide. For chips it must be purified to about 99.9999999% or better, so that fewer than one atom in a billion is an impurity. Tiny, controlled amounts of boron or phosphorus are then added to make the transistors work.` },
  { t: `The smell of rain has a name`, b: `The earthy smell after rain on dry ground is called petrichor, a word coined by two Australian scientists in 1964. Much of it comes from geosmin, a compound made by soil bacteria. The human nose is extraordinarily sensitive to geosmin and can detect it at a few parts per trillion, more sensitive than a shark is to blood.` },
  { t: `Why onions make you cry`, b: `When you cut an onion, you break its cells and mix enzymes with sulfur compounds. The reaction releases a volatile gas, syn-propanethial-S-oxide, which reaches your eyes and reacts with the water there to irritate them, so your eyes make tears to wash it away. Chilling the onion first slows the reaction.` },
  { t: `Measuring the heat of chilli`, b: `The heat of chillies comes from capsaicin, which triggers the same nerve receptors in your mouth that detect burning heat. In 1912 the pharmacist Wilbur Scoville created a scale by diluting chilli extract until tasters could no longer feel it. Capsaicin dissolves in fat and alcohol but not in water, which is why milk soothes a burning mouth better than water.` },
  { t: `Why durian smells so strong`, b: `Chemists who analysed durian in 2012 identified about 50 compounds that contribute to its aroma, including fruity esters and pungent sulfur compounds similar to those in onions and rotten eggs. The mixture is so powerful that durian is banned on public transport and in many hotels in Singapore and other parts of Southeast Asia.` },
  { t: `Chocolate is designed to melt in your mouth`, b: `Cocoa butter can crystallise in six different forms, each with its own melting point. Chocolate makers carefully "temper" chocolate so it sets in form V, which melts at about 34 °C: solid and snappy at room temperature, but melting just below body temperature on your tongue. If chocolate gets warm and re-sets in the wrong form, a whitish "bloom" appears.` },
  { t: `The chemistry of firework colours`, b: `Firework colours come from metal salts heated in the explosion: strontium gives red, sodium yellow, barium green, copper blue and a mix of strontium and copper purple. Each metal's electrons jump to higher energy levels and emit light of particular wavelengths as they fall back. A deep, pure blue is the hardest colour for pyrotechnicians to make.` },
  { t: `The Statue of Liberty used to be copper-coloured`, b: `The Statue of Liberty has a skin of copper sheets only about 2.4 mm thick. When it was unveiled in 1886 it was shiny reddish-brown. Over the following decades, the copper reacted with air, water and pollutants to form a green patina of copper carbonates, sulfates and chlorides, which now protects the metal underneath from further corrosion.` },
  { t: `Why stainless steel does not rust`, b: `In 1913 Harry Brearley in Sheffield found that steel containing about 13% chromium did not rust. The chromium reacts with oxygen to form an invisible layer of chromium oxide only a few nanometres thick, which seals the surface. If the layer is scratched, it repairs itself almost instantly in air.` },
  { t: `Dry ice skips the liquid stage`, b: `Solid carbon dioxide, "dry ice", is at −78.5 °C and turns directly from solid to gas without melting, which is called sublimation. That is why it leaves no puddle and is used to ship frozen food and vaccines. The fog effect on stages comes from dropping dry ice into warm water: the cold gas condenses water vapour into tiny droplets.` },
  { t: `Liquid nitrogen boils at −196 °C`, b: `Nitrogen, which makes up 78% of the air, becomes liquid only below −196 °C. Poured onto a warm floor, it boils so fast that the drops skate around on a cushion of vapour. It is used to freeze and store cells and embryos, to remove warts, and to make ice cream in seconds; because it expands about 700 times as it boils, it must never be sealed in a closed container.` },
  { t: `A bacterium that eats plastic bottles`, b: `PET plastic bottles can last for centuries in the environment. In 2016 Japanese scientists reported a bacterium, Ideonella sakaiensis, found near a bottle recycling plant, that can break down PET using two enzymes and live on it. Researchers are now engineering faster versions of these enzymes to recycle plastic back into its building blocks.` },
  { t: `Enzymes are astonishingly fast`, b: `Enzymes are protein catalysts. One of the most impressive, orotidine 5'-phosphate decarboxylase, speeds up a reaction needed to make DNA and RNA by a factor of about 10¹⁷. Without it, the reaction would have a half-life of about 78 million years; with the enzyme, it happens in a few milliseconds.` },
  { t: `Catalytic converters use precious metals`, b: `A car's catalytic converter contains tiny amounts of platinum, palladium and rhodium spread on a honeycomb of ceramic. They turn toxic carbon monoxide, nitrogen oxides and unburnt fuel into carbon dioxide, nitrogen and water. Rhodium is so rare that in 2021 it became the most expensive precious metal, worth many times the price of gold.` },
  { t: `Indonesia leads the world in nickel`, b: `Indonesia is the world's largest producer of nickel, supplying about half of global output in recent years. Nickel is used in stainless steel and, increasingly, in the cathodes of lithium-ion batteries for electric vehicles. Much of Indonesia's nickel ore comes from Sulawesi and Halmahera, where it is refined in large industrial parks.` },
  { t: `The islands of tin`, b: `The islands of Bangka and Belitung have been mined for tin for centuries, making Indonesia one of the world's top tin producers. Tin is essential for solder, which joins components on almost every circuit board in phones and computers. It is also used to coat steel cans, because tin resists corrosion.` },
  { t: `Your stomach holds hydrochloric acid`, b: `Gastric acid in your stomach has a pH of about 1.5 to 3.5, strong enough to dissolve some metals. It kills most bacteria in food and helps the enzyme pepsin break down proteins. The stomach protects itself with a thick layer of mucus and by constantly renewing its lining cells.` },
  { t: `Pure water hardly conducts electricity`, b: `It is the dissolved ions in tap water, sea water and sweat, not the water molecules themselves, that let electricity flow. Ultrapure water used in chip factories conducts electricity about a million times less well than sea water. Even so, never use electrical devices near water: ordinary water always contains enough ions to be dangerous.` },
  { t: `A dangerous metal plus a poisonous gas makes salt`, b: `Sodium is a soft metal that reacts violently with water, and chlorine is a toxic green gas that was used as a weapon in the First World War. Yet when they react together they form sodium chloride, ordinary table salt, which we need to live. Compounds can have completely different properties from the elements they are made of.` },
  { t: `Water is densest at 4 °C`, b: `Most liquids get denser as they cool, but water is densest at about 4 °C and expands as it approaches freezing. Hydrogen bonds hold the molecules of ice in an open hexagonal lattice with lots of empty space, which is why ice floats and why snowflakes have six-fold symmetry.` },
  { t: `Why ozone smells after a storm`, b: `Lightning splits oxygen molecules, and some of the atoms join O₂ to form ozone, O₃, which has a sharp, clean smell; its name comes from the Greek for "to smell". High in the stratosphere, the ozone layer absorbs most of the Sun's harmful ultraviolet light. Near the ground, however, ozone is a pollutant that irritates the lungs.` },
  { t: `The rarest natural element`, b: `Astatine, element 85, is formed only briefly during the decay of uranium and thorium, and its longest-lived form has a half-life of about 8 hours. It is estimated that less than a gram of it exists in the entire Earth's crust at any moment. No one has ever seen a visible piece of it, because any sample would vaporise from its own radioactive heat.` },
  { t: `Vulcanised rubber was discovered on a stove`, b: `Natural rubber turns sticky in heat and brittle in cold. In 1839 Charles Goodyear accidentally dropped a mixture of rubber and sulfur on a hot stove and found it became tough and elastic. Sulfur atoms form cross-links between the long rubber molecules. Vulcanised rubber made car tyres possible, and Indonesia is today one of the world's largest producers of natural rubber.` },
  { t: `The symbol J is missing`, b: `Look at the periodic table and you will not find the letter J in any element symbol. Symbols come from names in Latin, Greek, German or other languages: Fe for iron (ferrum), Na for sodium (natrium), K for potassium (kalium), Pb for lead (plumbum), Au for gold (aurum) and Ag for silver (argentum).` },
  { t: `Glass is an amorphous solid`, b: `In a crystal such as quartz, atoms sit in a regular repeating pattern. Glass is made of the same main ingredient, silicon dioxide, but it is cooled so quickly from the melt that the atoms freeze in a disordered arrangement, like a snapshot of a liquid. Nature makes glass too: obsidian forms when lava cools very fast.` },
  { t: `Rust is slow burning`, b: `Rusting and burning are both oxidation reactions: iron combining with oxygen releases heat, just much more slowly. Hand-warmer packets use this: they contain iron powder, salt and water, and when you open them and let air in, the iron rusts quickly enough to warm your hands for hours.` },
  { t: `Why soap removes grease`, b: `A soap molecule has a water-loving head and a long oil-loving tail. In water, the tails bury themselves in grease while the heads face outwards, forming tiny balls called micelles that can be rinsed away. People have made soap for more than 4,000 years by heating fats with alkali from wood ash; the Babylonians already recorded a recipe.` }
];

/* ---------------- credit / source (printed on every PDF) ---------------- */
const CREDIT = 'Chem Ladder · @rendyhn 2026';
const SITE = /^https?:$/.test(location.protocol) && !/^(localhost|127\.|\[::1\])/.test(location.hostname) && !/claude/i.test(location.hostname)
  ? (location.host + location.pathname).replace(/index\.html$/, '').replace(/\/$/, '') : '';
const SOURCE = SITE ? `${CREDIT} · ${SITE}` : CREDIT;
const sourceLine = () => `<p class="print-only print-source">${esc(ui('source'))} ${esc(SOURCE)}</p>`;
function updatePrintStyle() {   // page numbers and the source line live in the printed page margins
  let el = $('#print-page-style');
  if (!el) { el = document.createElement('style'); el.id = 'print-page-style'; document.head.appendChild(el); }
  const css = s => '"' + s.replace(/["\\]/g, '') + '"';
  const page = ((I18N.ui && I18N.ui.pageOf) || UI_EN.pageOf).split(/(⟦[01]⟧)/).filter(Boolean).map(p => (p === '⟦0⟧' ? 'counter(page)' : p === '⟦1⟧' ? 'counter(pages)' : css(p))).join(' ');
  el.textContent = `@media print { @page { @bottom-left { content: ${page}; } ${SITE ? `@bottom-right { content: ${css(SOURCE)}; }` : ''} } }`;
}

/* ---------------- registry ---------------- */
const TOPICS = new Map();
const SOON = new Map();   // planned topics: listed in the tracks and the prerequisite map, not yet written
LEVELS.forEach((lv, li) => {
  lv.index = li; lv.all = lv.topics; lv.topics = lv.all.filter(t => !t.soon);
  lv.all.forEach((t, k) => { t.level = lv; t.code = lv.mark + (k + 1); if (t.soon) SOON.set(t.id, t); });
  lv.topics.forEach((t, ti) => { t.index = ti; t.pool = t.gens.map(fn => ({ fn, topic: t.id })); TOPICS.set(t.id, t); });
  lv.review = lv.topics.length > 1 ? { id: 'review-' + lv.id, review: true, level: lv, index: lv.topics.length, pool: lv.topics.flatMap(t => t.pool) } : null;
  if (lv.review) TOPICS.set(lv.review.id, lv.review);
});
const ALL = LEVELS.flatMap(l => l.topics);
/* a link end is a topic here, a planned topic, or math:<id> / phys:<id> on the sister sites */
const linkEnd = id => { const m = /^(math|phys):(.+)$/.exec(id); return m ? (EXT[m[1]].topics[m[2]] ? { ext: m[1], extId: m[2] } : null) : TOPICS.get(id) || SOON.get(id) || null; };
LADDER.forEach(e => {
  const a = linkEnd(e.from), b = linkEnd(e.to);
  if (!a || !b || a.review || b.review || b.ext) { console.warn('ladder: unknown topic in', e.from, '->', e.to); return; }
  (b.needs || (b.needs = [])).push(e); if (!a.ext) (a.opens || (a.opens = [])).push(e);
});

    deck = FACTS.map((_, i) => i);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }

}

/* ---------------- checking ---------------- */
function currentSheet() { return current.view === 'topic' ? sheets.get(current.id) : null; }
function checkSheet(announce = true) {
  const sh = currentSheet(); if (!sh) return;
  let right = 0, blank = 0;
  const fbs = [];
  sh.items.forEach((it, i) => {
    const li = main.querySelector(`.q[data-i="${i}"]`); if (!li) return;
    const fb = li.querySelector('.feedback'); li.classList.remove('is-right', 'is-wrong', 'is-blank');
    let res;
    if (it.type === 'mc') {
      const a = sh.answers[i]; res = a == null ? null : a === it.correct;
      li.querySelectorAll('.choice').forEach((c, j) => { c.classList.toggle('is-answer', j === it.correct); c.classList.toggle('is-miss', j === a && a !== it.correct); });
    } else res = checkFill(it.check, sh.answers[i]);
    const correctTxt = it.type === 'mc' ? `${LETTERS[it.correct]} — ${it.choices[it.correct]}` : it.ansHTML;
    if (res === null) { blank++; li.classList.add('is-blank'); fb.innerHTML = `<span class="fb-tag">${esc(ui('notAnswered'))}</span> ${esc(ui('answerColon'))} ${correctTxt}`; }
    else if (res) { right++; li.classList.add('is-right'); fb.innerHTML = `<span class="fb-tag">${esc(ui('correct'))}</span>`; }
    else { li.classList.add('is-wrong'); fb.innerHTML = `<span class="fb-tag">${esc(ui('notQuite'))}</span> ${esc(ui('answerColon'))} ${correctTxt}`; }
    if (mjState === 'failed') fb.innerHTML = fallbackStr(fb.innerHTML);
    fbs.push(fb);
  });
  sh.checked = true;
  const score = main.querySelector('.score');
  if (score) score.innerHTML = `<b>${esc(ui('scoreLine', right, sh.items.length))}</b>${blank ? ` · ${esc(ui('unanswered', blank))}` : ''}`;
  fbs.forEach(typeset);
  if (announce) { const first = main.querySelector('.q.is-wrong, .q.is-blank'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

const LANG_FONTS = { zh: 'Noto+Sans+SC', ja: 'Noto+Sans+JP', ko: 'Noto+Sans+KR', ar: 'Noto+Sans+Arabic', fa: 'Vazirmatn', ru: 'Noto+Sans' };
const HTML_LANG = { zh: 'zh-Hans' };
const packLoads = {};
function loadPack(code) {
  if (code === 'en' || I18N_PACKS[code]) return Promise.resolve(true);
  if (!packLoads[code]) packLoads[code] = new Promise(res => {
    const s = document.createElement('script');
    s.src = `lang/${code}.js`; s.async = true;
    s.onload = () => res(!!I18N_PACKS[code]); s.onerror = () => { delete packLoads[code]; res(false); };

}

    const href = `https://fonts.googleapis.com/css2?family=${LANG_FONTS[code]}:wght@400;700;800&display=swap`;

async function changeLang(code, persist = true) {

  if (persist) store.set('lang', code);

function initialLang() {
  const codes = LANGS.map(l => l[0]);

  if (q && codes.includes(q)) return q;
