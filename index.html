  --top: 56px; --side: 292px;

}

  }
}

  --rule: #2A3446; --rule-soft: #212A39; --grid: rgba(143, 166, 255, 0.05);

    --g-water: #1C3A56; --g-water-2: #4F8FD0; --g-land: #2B3D28; --g-land-2: #4D6A3A; --g-sand: #5A4C2E; --g-rock: #4E4538; --g-rock-2: #8E7C63; --g-soil: #7A5236;
    --g-mantle: #A5542A; --g-core: #B8942E; --g-magma: #FF7043; --g-hot: #FF7A45; --g-cold: #5AA9F0; --g-veg: #6DB24A; --g-snow: #C8D3E0; --g-sky: #17263A; --g-cloud: #2A3446;

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16.5px/1.6 var(--f-body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; color: var(--ink); }
code { font: 0.88em var(--f-mono); background: var(--sunken); padding: 0.1em 0.35em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.print-only { display: none; }
svg { flex: none; }
.btn svg, .key-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
mjx-container { font-size: 104% !important; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }
mjx-container.mjx-wide { display: block; overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; margin: 0.35em 0; }   /* a long inline formula on its own scrolling line */
.fbm { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; white-space: nowrap; }
.fbm-d { display: block; text-align: center; margin: 0.6em 0; white-space: normal; }

/* ---------- top bar & shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 1.2rem var(--f-display); letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; }
.brand small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.04em; margin-inline-start: 4px; }
.menu-btn { display: none; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; }
.menu-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-inline-end: 1px solid var(--rule); padding: 16px 12px 48px; background: var(--bg); scrollbar-width: thin;
}
.search { position: relative; margin-bottom: 14px; }
.search input { width: 100%; font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; }
.search input::placeholder { color: var(--ink-3); }
.nav-level + .nav-level { margin-top: 18px; }
.nav-level-title { display: flex; align-items: center; gap: 10px; font: 700 0.95rem var(--f-display); padding: 4px 6px 6px; }
.nav-level-title small { display: block; font: 500 0.7rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.rung { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--lv); color: var(--paper); font: 700 0.75rem var(--f-mono); flex: none; }
.rung-lg { width: 36px; height: 36px; font-size: 1rem; border-radius: 8px; }
.nav-topics { list-style: none; margin: 0; padding: 0; }
.nav-topics a { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 0.92rem; line-height: 1.35; }
.nav-topics a:hover { background: var(--sunken); color: var(--ink); }
.nav-topics a[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: inset 3px 0 0 var(--lv), var(--shadow); font-weight: 700; }
.nav-topics .num { font: 500 0.72rem var(--f-mono); color: var(--ink-3); min-width: 1.4rem; }
.nav-review { font-style: italic; }
.main { padding: 32px clamp(16px, 4vw, 56px) 96px; min-width: 0; }
.scrim { display: none; }

/* ---------- buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 0.92rem var(--f-body); padding: 9px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-ghost { background: transparent; }
.btn-small { padding: 6px 12px; font-size: 0.85rem; }
.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 0.76rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lv, var(--accent)); margin: 0 0 12px; }
.lede { color: var(--ink-2); font-size: 1.08rem; max-width: 62ch; margin: 12px 0 0; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; max-width: 1180px; margin: 0 auto 48px; }
.hero h1 { font-size: clamp(2.1rem, 1.3rem + 3vw, 3.5rem); font-weight: 800; letter-spacing: -0.025em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero-logo svg { width: 72px; height: 72px; display: block; margin-bottom: 18px; filter: drop-shadow(0 6px 14px rgba(20, 27, 43, 0.22)); }   /* the subject logo above the title */
.hero-side { display: grid; gap: 16px; min-width: 0; }
.fact { background: var(--paper); border: 1px solid var(--rule); border-top: 3px solid var(--warn); border-radius: 10px; padding: 18px 22px; box-shadow: var(--shadow); }
.fact-label { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font: 500 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); }
.fact-label svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fact-title { font-size: 1.08rem; font-weight: 700; margin: 0 0 6px; line-height: 1.35; }
.fact-body { margin: 0; color: var(--ink-2); font-size: 0.95rem; line-height: 1.6; }
.fact .sample-actions { margin-top: 14px; }
.sample { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; box-shadow: var(--shadow); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; min-height: 200px; }
.sample-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sample-label { font: 500 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sample-topic { font: 600 0.78rem var(--f-mono); color: var(--lv); text-decoration: none; }
.sample-q { font-size: 1.05rem; }
.sample-choices { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.sample-choices li { display: flex; align-items: center; gap: 10px; }
.sample-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sample-ans { margin-top: 12px; border-top: 1px dashed var(--rule); }
.sample-answer { margin: 12px 0 4px; } .sample-sol { margin: 0; color: var(--ink-2); font-size: 0.95rem; }
.reveal.collapsed { height: 0; overflow: hidden; visibility: hidden; margin: 0; padding: 0; border: 0; }
.ladder { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.level { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
.level-head { display: flex; gap: 12px; align-items: center; }
.level-head h2 { font-size: 1.25rem; }
.band { margin: 2px 0 0; font: 500 0.74rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.level-blurb { color: var(--ink-2); font-size: 0.93rem; margin: 12px 0; }
.level-topics { margin: 0 0 14px; padding-inline-start: 1.4em; padding-inline-end: 0; font-size: 0.93rem; flex: 1; }
.level-topics li { padding: 2px 0; } .level-topics li::marker { color: var(--ink-3); font: 0.8em var(--f-mono); }
.level-topics a { color: var(--ink); text-decoration: none; } .level-topics a:hover { color: var(--lv); text-decoration: underline; }
.level-review { font-weight: 700; color: var(--lv); text-decoration: none; font-size: 0.92rem; }

/* ---------- topic ---------- */
.topic { max-width: 880px; margin: 0 auto; }
.crumbs { display: flex; gap: 8px; font: 0.8rem var(--f-mono); color: var(--ink-3); margin-bottom: 18px; }
.crumbs a { color: var(--ink-3); }
.topic-head h1 { font-size: clamp(2rem, 1.4rem + 2.2vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
.topic-tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--rule); }
.topic-tabs a { padding: 10px 18px; font: 700 0.98rem var(--f-display); color: var(--ink-3); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.topic-tabs a:hover { color: var(--ink); }
.topic-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--lv); }
#panel { margin-top: 28px; }

/* ---------- lesson prose ---------- */
.lesson-tools { display: flex; justify-content: flex-end; margin: -12px 0 8px; }
.prose { max-width: 70ch; }
.rungs { max-width: 70ch; margin: 0 0 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.rungs summary { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; list-style: none; font: 600 0.78rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.rungs summary::-webkit-details-marker { display: none; }
.rungs summary .chev { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; transform: rotate(-90deg); transition: transform 0.2s; }
[dir="rtl"] .rungs summary .chev { transform: rotate(90deg); }
.rungs[open] summary .chev { transform: none; }
.rungs summary:hover { color: var(--ink); }
.rungs-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; padding: 4px 16px 16px; }
.rungs-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rungs-col li a { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); text-decoration: none; }
.rungs-col li a:hover span:last-child { color: var(--lv); text-decoration: underline; }
.rungs-col li p { margin: 3px 0 0; font-size: 0.9rem; line-height: 1.5; color: var(--ink-2); }
.rungs-empty { margin: 0; font-size: 0.9rem; color: var(--ink-3); }
@media (max-width: 640px) { .rungs-cols { grid-template-columns: minmax(0, 1fr); } }
.prose > p, .prose li { color: var(--ink); }
.prose h3 { font-size: 1.3rem; margin: 2em 0 0.5em; }
.prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-inline-start: 1.3em; padding-inline-end: 0; }
.prose li + li { margin-top: 4px; }
.box { margin: 1.4em 0; padding: 14px 18px; border-radius: 8px; }
.box > :last-child { margin-bottom: 0; } .box > p:first-of-type { margin-top: 0; }
.box-label { font: 600 0.72rem var(--f-mono) !important; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px !important; }
.box-key { background: var(--accent-soft); } .box-key .box-label { color: var(--accent); }
.box-ex { border: 1.5px dashed var(--rule); background: var(--paper); } .box-ex .box-label { color: var(--ink-3); }
.box-tip { background: var(--warn-soft); } .box-tip .box-label { color: var(--warn); }
.formula { margin: 1em 0; padding: 4px 8px; overflow-x: auto; }
.tbl-wrap { overflow-x: auto; margin: 1em 0; }
.tbl { border-collapse: collapse; font-size: 0.93rem; min-width: 100%; background: var(--paper); font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--rule); padding: 7px 10px; text-align: start; vertical-align: middle; }
.tbl thead th, .tbl-q th { background: var(--sunken); font-weight: 700; }
.tbl-q { min-width: 0; width: auto; } .tbl-q td, .tbl-q th { text-align: center; }
.fig { margin: 1.4em 0; } .fig > svg { width: 100%; max-width: 520px; height: auto; display: block; }   /* direct child only: MathJax output in a caption is SVG too */
.fig figcaption { font-size: 0.85rem; color: var(--ink-3); margin-top: 6px; }
.g-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; max-width: 680px; }   /* small multiples side by side */
.g-row > div > svg { width: 100%; height: auto; display: block; }
.g-cap { font-size: 0.8rem; color: var(--ink-3); text-align: center; margin-top: 4px; line-height: 1.3; }
.fig-shape { fill: var(--accent-soft); stroke: var(--ink-2); stroke-width: 1.5; }
.fig-alpha { fill-opacity: 0.55; }
.fig-line { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.fig-dash { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.fig-frame { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.fig-sector { fill: var(--accent-soft); stroke: none; }
.fig-dot { fill: var(--ink); }
.fig-text { fill: var(--ink); font: italic 600 15px var(--f-body); }
.fig-small { fill: var(--ink-2); font: 12px var(--f-body); }
.fig.fig-wide > svg { max-width: 680px; }
.fig-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; max-width: 680px; }
.fig-row > div { display: grid; grid-template-rows: subgrid; grid-row: span 2; justify-items: center; row-gap: 0; min-width: 0; }
.fig-row > div > svg { height: auto; display: block; align-self: center; max-width: 100%; }
.fig-row > div > .cap { align-self: start; margin-top: 4px; }
@media (max-width: 560px) { .fig-row.c4, .fig-row.c5 { grid-template-columns: repeat(2, 1fr) !important; } }
.fig-row .cap { font-size: 0.8rem; color: var(--ink-3); text-align: center; margin-top: 4px; }
/* figure library (src/fig.js) */
.mf-grid { stroke: var(--rule); stroke-width: 1; }
.mf-axis { stroke: var(--ink-2); stroke-width: 1.6; fill: none; }
.mf-line { stroke: var(--ink-2); stroke-width: 1.6; fill: none; }
.mf-thin { stroke: var(--ink-3); stroke-width: 0.8; fill: none; }
.mf-ink { fill: var(--ink-2); } .mf-ink3 { fill: var(--ink-3); }
.mf-c1, .mf-c2, .mf-c3, .mf-c4 { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mf-c1 { stroke: var(--accent); } .mf-c2 { stroke: var(--lv1); } .mf-c3 { stroke: var(--lv2); } .mf-c4 { stroke: var(--lv4); }
.mf-s1 { fill: var(--accent); } .mf-s2 { fill: var(--lv1); } .mf-s3 { fill: var(--lv2); } .mf-s4 { fill: var(--lv4); }
.mf-f1 { fill: var(--accent); fill-opacity: 0.18; } .mf-f2 { fill: var(--lv1); fill-opacity: 0.22; } .mf-f3 { fill: var(--lv2); fill-opacity: 0.22; } .mf-f4 { fill: var(--lv4); fill-opacity: 0.2; }
.mf-s1l, .mf-s2l, .mf-s3l, .mf-s4l { stroke: var(--ink-2); }
.mf-s1l { fill: color-mix(in srgb, var(--accent) 26%, var(--paper)); } .mf-s2l { fill: color-mix(in srgb, var(--lv1) 26%, var(--paper)); }
.mf-s3l { fill: color-mix(in srgb, var(--lv2) 26%, var(--paper)); } .mf-s4l { fill: color-mix(in srgb, var(--lv4) 24%, var(--paper)); }
.mf-shape { fill: var(--accent-soft); stroke: var(--ink-2); stroke-width: 1.6; }
.mf-cell { fill: var(--paper); stroke: var(--ink-3); }
.mf-cellc { fill: var(--sunken); stroke: var(--rule); }
.mf-frame, .mf-ring { fill: none; stroke: var(--ink-2); stroke-width: 1.8; }
.mf-paper { fill: var(--paper); }
.mf-dot { fill: var(--ink); } .mf-open { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.mf-open-c { fill: var(--paper); stroke: var(--accent); stroke-width: 2.6; }
.mf-prime { fill: color-mix(in srgb, var(--lv1) 24%, var(--paper)); stroke: var(--lv1); stroke-width: 2; }
.mf-node-c { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.mf-lab, .mf-lab-b, .mf-small, .mf-var, .mf-node { paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
.mf-lab { fill: var(--ink); font: 13px var(--f-body); } .mf-lab-b { fill: var(--ink); font: 700 13px var(--f-body); }
.mf-small { fill: var(--ink-2); font: 11.5px var(--f-body); }
.mf-var { fill: var(--ink); font: italic 600 15px 'Times New Roman', Georgia, serif; }
.mf-node { fill: var(--ink); font: 700 15px var(--f-body); }
.mf-node-a { fill: var(--accent); font: 700 15px var(--f-body); paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; }
.mf-carry { fill: var(--lv4, var(--accent)); font: 700 12px var(--f-body); }
.lesson-foot { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); display: grid; gap: 20px; }
.lesson-foot > .btn { justify-self: start; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 700; }
.pager a:hover { border-color: var(--ink-3); }
.pager small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.pager-next { text-align: end; }

/* ---------- worksheet ---------- */
.ws-controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-bottom: 18px; }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl-label { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg-btn { font: 600 0.9rem var(--f-mono); border: 0; background: transparent; color: var(--ink-2); padding: 8px 13px; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select { font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.ctrl-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
.sheet {
  background-color: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; padding: clamp(18px, 3.5vw, 40px);
}
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.kicker { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--lv, var(--ink-3)); margin: 0 0 4px; }
.sheet-title h2 { font-size: 1.6rem; }
.sheet-meta { display: flex; gap: 18px; margin: 0; align-self: flex-end; }
.sheet-meta div { display: flex; flex-direction: column; }
.sheet-meta dt { font: 500 0.66rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sheet-meta dd { margin: 0; font: 600 0.92rem var(--f-mono); }
.sheet-note { font-size: 0.86rem; color: var(--ink-3); margin: 14px 0 0; }
.qs { list-style: none; margin: 0; padding: 0; }
.q { padding: 22px 0; border-bottom: 1px solid var(--rule-soft); }
.q-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.q-num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 50%; border: 1.5px solid var(--ink); font: 700 0.85rem var(--f-mono); flex: none; }
.q-type, .q-topic { font: 500 0.7rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.q-topic { color: var(--lv); }
.q-text { font-size: 1.04rem; overflow-x: auto; }
.q-text .tbl-wrap { margin: 10px 0; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; margin-top: 12px; }
.choice { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.choice:hover { border-color: var(--ink-3); }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice-body { min-width: 0; overflow-x: auto; }
.letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-3); font: 600 0.8rem var(--f-mono); color: var(--ink-2); flex: none; background: var(--paper); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.sel .letter { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.fill { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.fill-label { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.fill input { font: 16px var(--f-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-bottom: 2px solid var(--ink-2); border-radius: 6px 6px 0 0; padding: 8px 10px; width: min(100%, 260px); }
.fill input:focus { border-bottom-color: var(--accent); outline: none; box-shadow: 0 2px 0 var(--accent); }
.fill-unit { color: var(--ink-2); }
.fill-hint { font-size: 0.82rem; color: var(--ink-3); margin: 6px 0 0; }
.feedback { margin: 10px 0 0; font-size: 0.93rem; display: none; }
.q.is-right .feedback, .q.is-wrong .feedback, .q.is-blank .feedback { display: block; }
.fb-tag { font: 700 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; padding: 2px 8px; border-radius: 99px; margin-right: 6px; }
.q.is-right .fb-tag { background: var(--good-soft); color: var(--good); }
.q.is-wrong .fb-tag { background: var(--bad-soft); color: var(--bad); }
.q.is-blank .fb-tag { background: var(--sunken); color: var(--ink-2); }
.q.is-right .q-num { background: var(--good); border-color: var(--good); color: var(--paper); }
.q.is-wrong .q-num { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.q.is-wrong .fill input { border-bottom-color: var(--bad); } .q.is-right .fill input { border-bottom-color: var(--good); }
.choice.is-answer { border-color: var(--good); background: var(--good-soft); }
.choice.is-answer .letter { background: var(--good); border-color: var(--good); color: var(--paper); }
.choice.is-miss { border-color: var(--bad); background: var(--bad-soft); }
.choice.is-miss .letter { background: var(--bad); border-color: var(--bad); color: var(--paper); }
.check-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 24px; }
.score { margin: 0; font-size: 1rem; color: var(--ink-2); }
.score b { font: 700 1.15rem var(--f-mono); color: var(--ink); }

/* ---------- answer key ---------- */
.key-sec { margin-top: 28px; }
.key-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 2px solid var(--ink); }
.key-toggle { display: inline-flex; align-items: center; gap: 10px; font: 800 1.15rem var(--f-display); color: var(--ink); background: none; border: 0; padding: 6px 4px; cursor: pointer; }
.key-toggle .chev { width: 22px; height: 22px; transition: transform 0.2s; }
.key-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.key-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.key-body { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 8px clamp(16px, 3vw, 32px); }
.key-list { list-style: none; margin: 0; padding: 0; }
.key-list > li { padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
.key-list > li:last-child { border-bottom: 0; }
.key-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.key-ans { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; overflow-x: auto; }
.key-letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--good); color: var(--paper); font: 700 0.85rem var(--f-mono); }
.key-sol { margin: 8px 0 0; margin-inline-start: 40px; color: var(--ink-2); font-size: 0.94rem; overflow-x: auto; }

.site-mark {
  position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  font: 600 12px/1 var(--f-mono); letter-spacing: 0.02em; color: var(--ink-2); padding: 6px 10px; border-radius: 99px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid var(--rule); backdrop-filter: blur(6px); pointer-events: none;
}
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; z-index: 60; box-shadow: var(--shadow); }

/* ---------- languages: fonts, right-to-left, the language menu ---------- */
:root[lang^="zh"] { --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --f-display: var(--f-body); }
:root[lang="ja"] { --f-body: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif; --f-display: var(--f-body); }
:root[lang="ko"] { --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; --f-display: var(--f-body); }
:root[lang="ar"] { --f-body: 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif; --f-display: var(--f-body); }
:root[lang="fa"] { --f-body: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; --f-display: var(--f-body); }
:root[lang="ru"] { --f-body: 'Noto Sans', 'Segoe UI', system-ui, sans-serif; --f-display: var(--f-body); }
:root[lang="ar"] body *, :root[lang="fa"] body * { letter-spacing: normal !important; }   /* spacing breaks Arabic letter joining */
[dir="rtl"] .nav-topics a[aria-current="page"] { box-shadow: inset -3px 0 0 var(--lv), var(--shadow); }
mjx-container { direction: ltr; unicode-bidi: isolate; }
.lang-pick {
  margin-inline-start: auto; display: inline-flex; align-items: center; gap: 4px; height: 38px; padding-inline: 10px 4px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink-2);
}
.lang-pick svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.lang-pick select { border: 0; background: transparent; padding: 6px 2px; font: 600 14px var(--f-body); color: var(--ink); max-width: 46vw; cursor: pointer; }
.lang-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.lang-pick select:focus-visible { outline: none; }
.lang-code { display: none; }
.theme-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink-2); cursor: pointer; }
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme-btn .i-sun { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .i-sun { display: block; } :root:not([data-theme="light"]) .theme-btn .i-moon { display: none; } }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; } :root[data-theme="dark"] .theme-btn .i-moon { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .menu-btn { display: inline-flex; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: calc(var(--top) + env(safe-area-inset-top, 0px)); bottom: 0; height: auto; width: min(320px, 86vw); z-index: 40; background: var(--bg); transform: translateX(-102%); transition: transform 0.22s ease; box-shadow: var(--shadow); }
  [dir="rtl"] .sidebar { left: auto; right: 0; transform: translateX(102%); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(10, 14, 20, 0.45); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .main { padding-top: 24px; }
}
@media (max-width: 560px) {
  .brand small { display: none; }
  .topbar { gap: 8px; }
  .brand { gap: 8px; font-size: 1.05rem; white-space: nowrap; }
  .lang-pick { position: relative; flex: none; padding-inline: 10px; gap: 6px; }
  .lang-code { display: inline; white-space: nowrap; font: 600 13px var(--f-mono); color: var(--ink); }
  .lang-code::after { content: ' \25BE'; color: var(--ink-3); }
  .lang-pick select { position: absolute; inset: 0; width: 100%; max-width: none; opacity: 0; }
  .ctrl-actions { margin-inline-start: 0; width: 100%; }
  .sheet-meta { gap: 12px; }
  .key-sol { margin-inline-start: 0; }
  .pager { grid-template-columns: 1fr; } .pager-next { text-align: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- print ---------- */
@media print {
  /* watermark + page numbers live in the page margins, so they never cover questions (Chrome/Edge 131+) */
  @page {
    margin: 15mm 14mm 17mm;
    @bottom-right { content: "Physics Ladder · @rendyhn 2026"; font: 8.5pt 'IBM Plex Mono', Consolas, monospace; color: #555; }
    @bottom-left { content: "Page " counter(page) " of " counter(pages); font: 8.5pt 'IBM Plex Mono', Consolas, monospace; color: #888; }
  }
  .site-mark { display: none !important; }
  .print-source { font: 8.5pt var(--f-mono); color: #555; margin: 8px 0 0; }
  .q-text, .choice-body, .key-ans, .key-sol, .formula, .tbl-wrap, mjx-container[display="true"], mjx-container.mjx-wide { overflow: visible !important; }
  .fill input::placeholder { color: transparent; }
  mjx-container svg [stroke-width="0"] { stroke: none; }
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    color-scheme: light; --bg: #fff; --paper: #fff; --sunken: #f1f1f1; --ink: #000; --ink-2: #222; --ink-3: #555; --rule: #bbb; --rule-soft: #ddd; --grid: transparent; --accent: #000; --accent-soft: #f1f1f1; --good: #000; --good-soft: #fff; --warn: #000; --warn-soft: #f4f4f4; --shadow: none;
  }
  body { background: #fff; font-size: 11.5pt; }
  .topbar, .sidebar, .scrim, .toast, .topic-tabs, .crumbs, .no-print, .feedback { display: none !important; }
  .shell { display: block; } .main { padding: 0; } .topic { max-width: none; }
  .print-only { display: block !important; }
  .sheet { border: 0; box-shadow: none; padding: 0; background: none; }
  .sheet-head { border-bottom: 1.5px solid #000; }
  .name-line { display: flex !important; flex-wrap: wrap; gap: 8px 28px; width: 100%; margin-top: 10px; font-size: 10.5pt; }
  .q { padding: 12px 0; break-inside: avoid; border-bottom: 0; }
  .q-num { border-color: #000; background: none !important; color: #000 !important; }
  .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; margin-top: 6px; }
  .choice { border: 0 !important; background: none !important; padding: 2px 0; }
  .choice .letter { background: none !important; border: 1px solid #000 !important; color: #000 !important; width: 22px; height: 22px; }
  .fill { margin-top: 8px; } .fill input { border: 0; border-bottom: 1px solid #000; border-radius: 0; width: 60mm; box-shadow: none; }
  .fill-label { color: #000; }
  .key-body { border: 0; padding: 0; }
  .key-body.collapsed { display: none; }
  .key-list > li { break-inside: avoid; padding: 8px 0; }
  .key-letter { background: none; border: 1px solid #000; color: #000; }
  .key-print-head { margin-bottom: 8px; padding-bottom: 10px; border-bottom: 1.5px solid #000; }
  .key-print-head h2 { font-size: 1.4rem; } .key-print-head p { margin: 4px 0 0; }
  body[data-print] .topic-head { display: none; }
  body[data-print="lesson"] .topic-head { display: block; }
  body[data-print="lesson"] .lede { max-width: none; }
  body[data-print="questions"] .key-sec { display: none !important; }
  body[data-print="key"] .sheet { display: none !important; }
  body[data-print="key"] .key-body.collapsed, body[data-print="both"] .key-body.collapsed { display: block !important; height: auto !important; overflow: visible !important; visibility: visible !important; }
  body[data-print="both"] .key-sec { break-before: page; }
  .key-sec { margin-top: 0; }
  .box, .tbl-wrap, .fig, .formula { break-inside: avoid; }
  a { color: #000; text-decoration: none; }
}

/* ---------- planned topics ---------- */
.nav-soon { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; color: var(--ink-3); font-size: 0.92rem; line-height: 1.35; }
.nav-soon .num { font: 500 0.72rem var(--f-mono); min-width: 1.4rem; }
.nav-soon small { display: block; font: 500 0.66rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.level-topics li.soon { color: var(--ink-3); }
.level-soon { margin: 12px 0 0; font-size: 0.88rem; color: var(--ink-3); }
.rungs-soon { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink-3); }
.rungs-soon .rung { opacity: 0.55; }
.rungs-soon small, .rungs-math small { font: 500 0.68rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.rungs-math .rung { background: var(--ink-2); }

/* ---------- physics diagrams ---------- */
.fig-vec { fill: none; stroke-linecap: round; }
.fig-vec-a { stroke: var(--accent); } .fig-head-a { fill: var(--accent); }
.fig-vec-b { stroke: var(--bad); } .fig-head-b { fill: var(--bad); }
.fig-vec-c { stroke: var(--ink-3); } .fig-head-c { fill: var(--ink-3); }
.fig-grid { stroke: var(--rule-soft); stroke-width: 1; }
.fig-plot { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; }
.fig-dashed { stroke-dasharray: 6 5; }
.fig-block { fill: var(--sunken); stroke: var(--ink-2); stroke-width: 1.5; }
.fig-wire { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }

  let d = ''; const N = 400;

  lesson: () => T`
<p>An <b>atom</b> is the smallest particle of an element. It has a tiny, dense <b>nucleus</b> of protons and neutrons, surrounded by electrons. The atom is mostly empty space: if the nucleus were a marble in the middle of a football stadium, the electrons would be moving around the outer stands.</p>
${Tbl([T`Particle`, T`Where`, T`Relative mass`, T`Relative charge`], [[T`proton`, T`nucleus`, '1', '+1'], [T`neutron`, T`nucleus`, '1', '0'], [T`electron`, T`shells around the nucleus`, T`$\tfrac{1}{1836}$ (almost 0)`, '−1']])}

${Key(T`<p><b>Atomic number</b> $Z$ = number of protons (it defines the element).<br><b>Mass number</b> $A$ = protons + neutrons. So</p><p>$$\text{neutrons} = A - Z.$$</p><p>A neutral atom has as many electrons as protons. The nuclide notation writes both numbers: $$ {}^{A}_{Z}\mathrm{X} \qquad \text{e.g. } {}^{23}_{11}\mathrm{Na}: 11 \text{ protons},\ 12 \text{ neutrons},\ 11 \text{ electrons}.$$</p>`)}
<h3>Ions</h3>
<p>An <b>ion</b> is an atom that has lost or gained electrons; the nucleus does not change. Losing electrons gives a <b>positive</b> ion (cation), gaining them a <b>negative</b> ion (anion): $\ce{Na+}$ has 10 electrons, $\ce{Cl-}$ has 18.</p>
<h3>Isotopes</h3>
<p><b>Isotopes</b> are atoms of the same element with different numbers of neutrons: same $Z$, different $A$. They have the same chemistry but different masses.</p>
${FigRow([[1, T`hydrogen-1 (protium)`], [2, T`hydrogen-2 (deuterium)`], [3, T`hydrogen-3 (tritium)`]].map(([A, t]) => [bohrSvg(1, { A, W: 150, label: t }), t]), T`The three isotopes of hydrogen: each has 1 proton and 1 electron, but 0, 1 or 2 neutrons.`)}

  id: 'atomic-models', stage: 'sh', title: 'Models of the Atom & Atomic Spectra',
  blurb: 'From Dalton to Thomson, Rutherford, Bohr and the quantum-mechanical model; energy levels, line spectra and flame tests.',
  lesson: () => T`
<p>Nobody can see inside an atom, so chemists build <b>models</b> that explain experiments, and improve them when a new experiment does not fit.</p>
${FigW(atomModelsSvg([T`Dalton (1803)`, T`Thomson (1897)`, T`Rutherford (1911)`, T`Bohr (1913)`, T`quantum model (1926)`], { label: T`Five models of the atom: a solid sphere, a plum pudding, a nucleus with orbiting electrons, fixed circular shells, and an electron cloud` }), T`How the model of the atom changed.`)}
${Tbl([T`Model`, T`Idea`, T`Evidence or weakness`], [[T`Dalton`, T`atoms are tiny indivisible spheres; each element has its own atoms`, T`explains fixed mass ratios in compounds; cannot explain electricity or ions`], [T`Thomson`, T`a positive sphere with electrons stuck in it ("plum pudding")`, T`discovered the electron (cathode rays)`], [T`Rutherford`, T`a tiny, dense, positive nucleus with electrons around it`, T`gold foil: most alpha particles passed straight through, a few bounced back; could not explain why electrons do not spiral into the nucleus`], [T`Bohr`, T`electrons move only in fixed energy levels (shells)`, T`explains the line spectrum of hydrogen; fails for atoms with more electrons`], [T`Quantum mechanical (Schrödinger)`, T`electrons are found in orbitals: regions where they are likely to be`, T`the model used today`]])}
<h3>Energy levels and line spectra</h3>
<p>In Bohr's model the energy of an electron in hydrogen can only take the values $E_n = -\frac{13.6\ \mathrm{eV}}{n^2}$. When an electron drops from a higher level to a lower one, the atom emits a photon with exactly the energy difference:</p>
${Fm(T`\Delta E = E_{\text{high}} - E_{\text{low}} = h f = \frac{hc}{\lambda} \qquad \lambda\ (\mathrm{nm}) \approx \frac{1240}{\Delta E\ (\mathrm{eV})}`)}
${Fig(levelsSvg([[3, 2, 'mf-c4'], [4, 2, 'mf-c2'], [5, 2, 'mf-c3'], [2, 1, 'mf-c1']], { label: T`Hydrogen energy levels with electrons falling from levels 3, 4 and 5 to level 2 and from 2 to 1` }), T`Falls to $n = 2$ give visible light (red 656 nm, blue-green 486 nm, violet 434 nm); falls to $n = 1$ give ultraviolet.`)}
${Key(T`<p>Each element has its own set of energy levels, so its <b>line spectrum</b> is like a fingerprint. Heating a compound in a flame shows the colour of its metal ion: sodium yellow, potassium lilac, lithium red, calcium orange-red, strontium crimson, barium green, copper blue-green. Fireworks use these colours.</p>`)}
${Tip(T`<p>Electrons in the Bohr model are not little planets: in the modern model we only know where an electron is <i>likely</i> to be, which is why we speak of orbitals instead of orbits.</p>`)}`,
  gens: [
    () => {

      return { q: T`Which scientist ${d}?`, a, w: [T`Thomson`, T`Rutherford`, T`Bohr`, T`Dalton`, T`Schrödinger`].filter(x => x !== a).sort(() => rng() - 0.5).slice(0, 3), only: 'mc', s: T`<b>${a}</b>.` };

      return { q: T`Using $E_n = -\frac{13.6}{n^2}$ eV, find the energy (in eV) of the photon emitted when a hydrogen electron falls from $n = ${hi}$ to $n = ${lo}$.`, a: dE, u: 'eV', rtol: 0.01, w: [sig(13.6 / (hi * hi), 3), sig(13.6 / (lo * lo), 3), sig(13.6 * (1 / lo - 1 / hi), 3)], s: T`$\Delta E = 13.6\left(\frac{1}{${lo}^2} - \frac{1}{${hi}^2}\right) = ${M(dE)}$ eV.` };

{
  id: 'electron-config', stage: 'sh', title: 'Electron Configuration & Quantum Numbers',
  blurb: 'Shells, subshells and orbitals, the aufbau principle, Pauli exclusion and Hund’s rule, writing configurations, valence electrons, and the four quantum numbers.',
  lesson: () => T`
<p>Electrons fill <b>shells</b> ($n = 1, 2, 3, \ldots$), each made of <b>subshells</b> $s$, $p$, $d$, $f$. A subshell is made of <b>orbitals</b>, and each orbital holds at most two electrons of opposite spin.</p>
${Tbl([T`Subshell`, T`Orbitals`, T`Maximum electrons`], [['s', '1', '2'], ['p', '3', '6'], ['d', '5', '10'], ['f', '7', '14']])}
${FigW(orbitalShapesSvg(['s', 'p_x', 'p_y', 'p_z'], { label: T`Shapes of an s orbital (a sphere) and the three p orbitals (dumbbells along x, z and y)` }), T`An $s$ orbital is a sphere; the three $p$ orbitals are dumbbells along the $x$, $y$ and $z$ axes.`)}
${Key(T`<p><b>Aufbau principle:</b> electrons fill the lowest energy subshell first: $1s\ 2s\ 2p\ 3s\ 3p\ 4s\ 3d\ 4p\ 5s \ldots$<br><b>Pauli exclusion principle:</b> an orbital holds at most two electrons, with opposite spins.<br><b>Hund's rule:</b> in a subshell, electrons occupy empty orbitals singly (same spin) before they pair up.</p>`)}
${Fig(aufbauSvg({ label: T`The diagonal rule for the filling order of subshells` }), T`Follow the arrows for the filling order: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, …`)}
${Ex(T`<p>Iron, $Z = 26$: $1s^2\,2s^2\,2p^6\,3s^2\,3p^6\,4s^2\,3d^6$, or in short $[\mathrm{Ar}]\,4s^2\,3d^6$.</p>`)}
${Fig(orbitalSvg(26, { from: 5, label: T`Orbital diagram of the 4s and 3d subshells of iron` }), T`The $4s$ and $3d$ electrons of iron: by Hund's rule the six $3d$ electrons give four unpaired electrons.`)}
${Key(T`<p>Two common exceptions: chromium $[\mathrm{Ar}]\,4s^1\,3d^5$ and copper $[\mathrm{Ar}]\,4s^1\,3d^{10}$, because half-full and full $d$ subshells are extra stable.</p><p>The <b>valence electrons</b> are those in the outermost shell (for main-group elements). They decide the chemistry: the group number of an $s$- or $p$-block element follows from them, and the period number is the highest shell $n$.</p>`)}
<h3>The four quantum numbers</h3>
${Tbl([T`Quantum number`, T`Symbol`, T`Values`, T`Describes`], [[T`principal`, '$n$', '$1, 2, 3, \\ldots$', T`the shell (size and energy)`], [T`azimuthal`, '$l$', T`$0$ to $n - 1$ ($s = 0$, $p = 1$, $d = 2$, $f = 3$)`, T`the subshell (shape)`], [T`magnetic`, '$m$', T`$-l$ to $+l$`, T`the orbital (orientation)`], [T`spin`, '$s$', '$+\\tfrac12$ or $-\\tfrac12$', T`the spin of the electron`]])}
${Tip(T`<p>When an atom forms a positive ion, the $4s$ electrons are lost before the $3d$ electrons: $\mathrm{Fe}^{2+}$ is $[\mathrm{Ar}]\,3d^6$, not $[\mathrm{Ar}]\,4s^2\,3d^4$.</p>`)}`,

        : { q: T`An element has the configuration $${configT(Z, true)}$. In which group is it?`, a: g, w: [g <= 2 ? g + 1 : g - 10, p, g + 1], s: g <= 2 ? T`It ends in $s^{${g}}$: group <b>${g}</b>.` : g >= 13 ? T`It ends in $s^2p^{${g - 12}}$: $2 + ${g - 12} = ${g - 10}$ valence electrons, group <b>${g}</b>.` : T`For a $d$-block element add the $s$ and $d$ electrons: group <b>${g}</b>.` };

  lesson: () => T`
<p>The <b>periodic table</b> lists the elements in order of atomic number. Elements in the same vertical <b>group</b> have the same number of valence electrons and similar chemistry; the horizontal <b>periods</b> correspond to the shells being filled. The table was first organised by Dmitri Mendeleev in 1869, who even left gaps for elements not yet discovered.</p>
${FigW(periodicSvg({ label: T`The periodic table coloured by block: s block red, p block green, d block blue, f block yellow` }), T`The blocks show which subshell is being filled: $s$ (groups 1–2), $p$ (13–18), $d$ (3–12, transition metals) and $f$ (lanthanides and actinides).`)}
${Tbl([T`Group`, T`Name`, T`Valence electrons`, T`Typical behaviour`], [['1', T`alkali metals`, '1', T`soft, very reactive metals; form $\ce{M+}$ ions`], ['2', T`alkaline earth metals`, '2', T`reactive metals; form $\ce{M^2+}$ ions`], ['17', T`halogens`, '7', T`reactive non-metals; form $\ce{X-}$ ions`], ['18', T`noble gases`, T`8 (He: 2)`, T`very unreactive gases`]])}
<h3>Trends</h3>
${FigW(periodicSvg({ f: false, maxZ: 86, trend: (L, T0, c) => sArrow(L + 2 * c, T0 + 7.35 * c, L + 16 * c, T0 + 7.35 * c, 'mf-c4', 10) + sT(L + 9 * c, T0 + 7.35 * c + 16, T`ionisation energy and electronegativity increase →`, 'mf-lab-b') + sArrow(L - 14, T0 + 0.3 * c, L - 14, T0 + 6.8 * c, 'mf-c1', 9), label: T`Periodic trends: ionisation energy and electronegativity increase across a period, atomic radius increases down a group` }).replace('</svg>', '').replace(/viewBox="0 0 (\d+) (\d+)"/, (m, w, h) => `viewBox="0 0 ${w} ${+h + 30}"`) + '</svg>', T`Across a period (left to right) the nuclear charge rises while the shell stays the same, so atoms get <b>smaller</b> and hold their electrons more tightly. Down a group a new shell is added each time, so atoms get <b>larger</b> (blue arrow).`)}
${Tbl([T`Property`, T`Across a period →`, T`Down a group ↓`], [[T`atomic radius`, T`decreases`, T`increases`], [T`first ionisation energy`, T`increases (generally)`, T`decreases`], [T`electronegativity`, T`increases`, T`decreases`], [T`metallic character`, T`decreases`, T`increases`]])}
${Fig(planeSvg({ W: 400, H: 240, x: [0, 21], y: [0, 2.6], step: [2, 0.5], tickX: 2, xl: 'Z', yl: T`MJ/mol`, extra: (X, Y) => sPline(IE1.slice(0, 20).map((v, i) => [X(i + 1), Y(v / 1000)]), 'mf-c1', ' fill="none" stroke-width="2"') + IE1.slice(0, 20).map((v, i) => sC(X(i + 1), Y(v / 1000), 3, 'mf-dot') + ([9, 17].includes(i) ? sT(X(i + 1), Y(v / 1000) - 8, SYMBOLS[i], 'mf-small') : [1].includes(i) ? sT(X(i + 1) + 14, Y(v / 1000) + 4, SYMBOLS[i], 'mf-small') : [2, 10, 18].includes(i) ? sT(X(i + 1), Y(v / 1000) + 16, SYMBOLS[i], 'mf-small') : '')).join(''), label: T`First ionisation energies of elements 1 to 20: peaks at the noble gases helium, neon and argon, and minima at the alkali metals` }), T`First ionisation energy of elements 1–20 in MJ/mol, i.e. thousands of kJ/mol (NIST data): peaks at the noble gases, dips at the alkali metals, and a small dip at boron and oxygen.`)}

{
  id: 'reacting-quantities', stage: 'sh', title: 'Reacting Masses, Limiting Reagent & Yield',
  blurb: 'Using mole ratios from balanced equations to find masses and volumes, the limiting and excess reagent, theoretical, actual and percentage yield, and atom economy.',
  lesson: () => T`
<p>A balanced equation gives the <b>mole ratio</b> of the substances. $\ce{2H2 + O2 -> 2H2O}$ means 2 mol of hydrogen react with 1 mol of oxygen to give 2 mol of water, whatever the amounts.</p>
${Key(T`<p><b>Three steps</b> for any reacting-quantities problem: (1) convert what you know into moles, (2) use the mole ratio from the equation, (3) convert the moles of the unknown into what you are asked for (mass, volume, particles).</p>`)}
${Fig(flowSvg([T`mass of A (g)`, T`÷ M(A) → moles of A`, T`× mole ratio B : A → moles of B`, T`× M(B) → mass of B (g)`], { W: 380, label: T`Steps: mass of A, divide by its molar mass, multiply by the mole ratio, multiply by the molar mass of B` }), T`From the mass of one substance to the mass of another.`)}
${Ex(T`<p>What mass of calcium oxide forms when 50 g of calcium carbonate is heated? $\ce{CaCO3 -> CaO + CO2}$</p><p>$n(\ce{CaCO3}) = \frac{50}{100} = 0.50$ mol; ratio 1 : 1, so $n(\ce{CaO}) = 0.50$ mol; $m = 0.50 \times 56 = 28$ g.</p>`)}
<h3>Limiting reagent</h3>
<p>Reactants are often not mixed in exactly the right ratio. The reactant that runs out first is the <b>limiting reagent</b>: it decides how much product forms. The other one is <b>in excess</b> and some is left over.</p>
${Fig(reactionBoxesSvg([[5, MOL.H2], [2, MOL.O2]], [[4, MOL.H2O], [1, MOL.H2]], { names: [T`before: 5 H₂ + 2 O₂`, T`after: 4 H₂O + 1 H₂ left`], seeds: [3, 11], label: T`Five hydrogen and two oxygen molecules give four water molecules with one hydrogen molecule left over` }), T`2 $\ce{O2}$ can only react with 4 $\ce{H2}$: oxygen is the limiting reagent and one $\ce{H2}$ is left over.`)}
${Key(T`<p>To find the limiting reagent, divide the moles of each reactant by its coefficient: the smallest result is limiting.<br><b>Percentage yield</b> compares what you actually obtained with the theoretical maximum: $$\text{percentage yield} = \frac{\text{actual yield}}{\text{theoretical yield}} \times 100\%$$ <b>Atom economy</b> measures how much of the reactants ends up in the useful product: $$\text{atom economy} = \frac{M_r \text{ of desired product}}{\text{sum of } M_r \text{ of all products}} \times 100\%$$</p>`)}
${Tip(T`<p>Yields are below 100% because reactions may be reversible, some product is lost while separating and purifying it, and side reactions make other products. A high atom economy means less waste: a key idea of green chemistry.</p>`)}`,
  gens: [
    () => {
      const [e, a, b, ra, rb] = pick([['\\ce{CaCO3 -> CaO + CO2}', 'CaCO3', 'CaO', 1, 1], ['\\ce{2Mg + O2 -> 2MgO}', 'Mg', 'MgO', 2, 2], ['\\ce{2H2 + O2 -> 2H2O}', 'H2', 'H2O', 2, 2], ['\\ce{Fe2O3 + 3CO -> 2Fe + 3CO2}', 'Fe2O3', 'Fe', 1, 2], ['\\ce{N2 + 3H2 -> 2NH3}', 'H2', 'NH3', 3, 2], ['\\ce{CH4 + 2O2 -> CO2 + 2H2O}', 'CH4', 'H2O', 1, 2], ['\\ce{2Al + 3Cl2 -> 2AlCl3}', 'Al', 'AlCl3', 2, 2], ['\\ce{Zn + 2HCl -> ZnCl2 + H2}', 'Zn', 'ZnCl2', 1, 1]]);
      const Ma = mm(a), Mb = mm(b), na = pick([0.1, 0.2, 0.5, 1, 2, 0.25]), ma = sig(na * Ma, 3), nb = na * rb / ra, mb = sig(nb * Mb, 3);
      return { q: T`$${e}$. What mass of $\ce{${b}}$ forms from ${NUM(ma)} g of $\ce{${a}}$? ($M$: ${a} ${NUM(Ma)}, ${b} ${NUM(Mb)} g/mol)`, a: mb, u: 'g', rtol: 0.01, w: [sig(na * Mb, 3), sig(ma * Mb / Ma * ra / rb, 3), ma], s: T`$n(\ce{${a}}) = \frac{${M(ma)}}{${M(Ma)}} = ${M(sig(na, 3))}$ mol; ratio ${ra} : ${rb}, so $n(\ce{${b}}) = ${M(sig(nb, 3))}$ mol; $m = ${M(sig(nb, 3))} \times ${M(Mb)} = ${M(mb)}$ g.` };
    },
    () => {
      const [e, A, B, ca, cb] = pick([['\\ce{2H2 + O2 -> 2H2O}', 'H2', 'O2', 2, 1], ['\\ce{N2 + 3H2 -> 2NH3}', 'N2', 'H2', 1, 3], ['\\ce{2Mg + O2 -> 2MgO}', 'Mg', 'O2', 2, 1], ['\\ce{Zn + 2HCl -> ZnCl2 + H2}', 'Zn', 'HCl', 1, 2], ['\\ce{2Al + 3Cl2 -> 2AlCl3}', 'Al', 'Cl2', 2, 3]]);
      const na = pick([1, 2, 3, 4, 5, 6]), nb = pick([1, 2, 3, 4, 5, 6]), lim = na / ca < nb / cb ? A : na / ca > nb / cb ? B : null;
      if (!lim) return { q: T`$${e}$. ${na} mol of $\ce{${A}}$ is mixed with ${nb + 1} mol of $\ce{${B}}$. Which is the limiting reagent?`, a: na / ca < (nb + 1) / cb ? `$\\ce{${A}}$` : `$\\ce{${B}}$`, w: [na / ca < (nb + 1) / cb ? `$\\ce{${B}}$` : `$\\ce{${A}}$`, T`neither`], only: 'mc', s: T`Divide by the coefficients: ${A} $${na}/${ca} = ${M(sig(na / ca, 3))}$, ${B} $${nb + 1}/${cb} = ${M(sig((nb + 1) / cb, 3))}$. The smaller one is limiting.` };

  ],
},
{

  blurb: 'Percentage by mass of an element in a compound, finding the empirical formula from masses or percentages, the molecular formula from the molar mass, and water of crystallisation.',
  lesson: () => T`
<p>The <b>percentage by mass</b> of an element in a compound is $$\%\,\text{element} = \frac{\text{number of atoms} \times A_r}{M_r} \times 100\%$$</p>
${Fig(donutSvg([{ label: T`carbon`, value: 40.0, show: '40.0%' }, { label: T`hydrogen`, value: 6.7, show: '6.7%' }, { label: T`oxygen`, value: 53.3, show: '53.3%' }], { center: 'C₆H₁₂O₆', label: T`Percentage composition by mass of glucose: carbon 40.0 percent, hydrogen 6.7 percent, oxygen 53.3 percent` }), T`Glucose $\ce{C6H12O6}$ ($M_r = 180$): carbon $\frac{72}{180} = 40.0\%$, hydrogen $\frac{12}{180} = 6.7\%$, oxygen $\frac{96}{180} = 53.3\%$.`)}
${Key(T`<p>The <b>empirical formula</b> is the simplest whole-number ratio of atoms; the <b>molecular formula</b> is the actual number of atoms in a molecule. Glucose: molecular $\ce{C6H12O6}$, empirical $\ce{CH2O}$. The molecular formula is a whole-number multiple of the empirical one: $$n = \frac{M_r(\text{molecular})}{M_r(\text{empirical})}$$</p>`)}
${Ex(T`<p>A compound contains 85.7% carbon and 14.3% hydrogen, and $M_r = 56$. Find its formulas.</p>`)}
${Tbl([T`Step`, 'C', 'H'], [[T`mass in 100 g`, '85.7 g', '14.3 g'], [T`÷ $A_r$ → moles`, '$\\frac{85.7}{12} = 7.14$', '$\\frac{14.3}{1} = 14.3$'], [T`÷ smallest → ratio`, '1', '2.00'], [T`empirical formula`, '$\\ce{CH2}$', ''], [T`$n = \frac{56}{14} = 4$`, T`molecular formula $\ce{C4H8}$`, '']])}
${Tip(T`<p>If a ratio ends in about .5, .33 or .25, multiply all of them by 2, 3 or 4 to reach whole numbers: 1 : 1.5 becomes 2 : 3. Hydrated salts are handled the same way: find the mole ratio of anhydrous salt to water, e.g. $\ce{CuSO4.5H2O}$.</p>`)}`,

      const others = ['CH3', 'CH', 'NO', 'N2O', 'FeO', 'Fe3O4', 'C2H4O', 'NaSO4', 'CHO', 'PO2', 'Mg2O', 'C2H2', 'CO', 'CH2O2'].filter(x => x !== emp).sort(() => rng() - 0.5).slice(0, 3);
      return { q: T`A compound contains ${pcs.map(([e, v]) => `${NUM(v)}% ${e}`).join(', ')} by mass. What is its empirical formula?`, a: `$\\ce{${emp}}$`, w: others.map(x => `$\\ce{${x}}$`), only: 'mc', s: T`Moles in 100 g: ${pcs.map(([e, v]) => `${e} $\\frac{${M(v)}}{${M(ARS[e])}} = ${M(sig(v / ARS[e], 3))}$`).join(', ')}. Divide by the smallest (and scale to whole numbers): $\ce{${emp}}$.` }; },

(() => {
const R = 8.314;
const SOL = { KNO3: [13.3, 31.6, 63.9, 110, 169, 246], NH4Cl: [29.4, 37.2, 45.8, 55.2, 65.6, 77.3], KCl: [27.6, 34.0, 40.0, 45.5, 51.1, 56.7], NaCl: [35.7, 36.0, 36.6, 37.3, 38.4, 39.8] };
const solAt = (f, t) => { const a = SOL[f], i = Math.min(4, Math.floor(t / 20)), u = t / 20 - i; return a[i] + (a[i + 1] - a[i]) * u; };
level({
  id: 'solutions', mark: 'E', name: 'Gases, Solutions & Colloids', short: 'Solutions', band: 'Gas laws · concentration · colligative · colloids', color: 'lv5',
  blurb: 'How gases behave (the gas laws and the ideal gas equation), how to make and dilute solutions, solubility, the colligative properties of solutions, and colloids.',
  topics: [
{
  id: 'gas-laws', stage: 'sh', title: 'Gas Laws & the Ideal Gas Equation',
  blurb: 'The kinetic theory of gases, pressure, Boyle’s, Charles’s and Gay-Lussac’s laws, absolute temperature, the ideal gas equation PV = nRT, Avogadro’s law and partial pressures.',
  lesson: () => T`
<p>In a gas the particles move fast and randomly, far apart from one another. Every collision with the walls pushes on them: the total push per unit area is the <b>pressure</b>. The <b>kinetic theory</b> explains the gas laws with this picture.</p>
${FigRow([[pistonSvg({ n: 10, h: 0.95, seed: 4, label: T`Gas in a large volume: few collisions with the walls` }), T`large $V$, low $P$`], [pistonSvg({ n: 10, h: 0.45, seed: 6, label: T`The same gas squeezed into half the volume: twice as many collisions` }), T`half $V$, double $P$`], [pistonSvg({ n: 10, h: 0.95, seed: 4, hot: true, label: T`The gas heated at the same volume: faster particles hit the walls harder and more often` }), T`higher $T$, higher $P$`]], T`Squeezing a gas makes the particles hit the walls more often (higher pressure); heating makes them move faster and hit harder.`)}
${Key(T`<p>Always use <b>absolute temperature</b> in kelvin: $T(\mathrm{K}) = t(°\mathrm{C}) + 273$.</p><p><b>Boyle's law</b> (constant $T$): $PV = \text{constant}$, so $P_1V_1 = P_2V_2$.<br><b>Charles's law</b> (constant $P$): $\frac{V}{T} = \text{constant}$.<br><b>Gay-Lussac's law</b> (constant $V$): $\frac{P}{T} = \text{constant}$.<br>Combined: $$\frac{P_1V_1}{T_1} = \frac{P_2V_2}{T_2}$$</p>`)}
${FigRow([[planeSvg({ W: 280, H: 220, x: [0, 5.4], y: [0, 5.4], step: [1, 1], xl: 'V', yl: 'P', fns: [{ f: x => 4 / x, from: 0.75, to: 5.2, cls: 'mf-c1' }], ticks: false, label: T`Boyle's law: pressure against volume is a hyperbola` }), T`Boyle: $P \propto \frac{1}{V}$`], [planeSvg({ W: 280, H: 220, x: [-290, 330], y: [0, 3.3], step: [100, 1], tickX: 300, xl: 't (°C)', yl: 'V', fns: [{ f: t => (t + 273) / 200, from: -273, to: 0, cls: 'mf-c4', dash: true }, { f: t => (t + 273) / 200, from: 0, to: 320, cls: 'mf-c1' }], pts: [[-273, 0, '−273 °C', 'start', false, 6, 18]], ticks: true, fmtY: () => '', label: T`Charles's law: volume against temperature is a straight line that reaches zero volume at minus 273 degrees Celsius` }), T`Charles: extrapolated to $V = 0$ at −273 °C`]], T`The graph of $V$ against $t$ always extrapolates to −273 °C, whatever the gas: this is <b>absolute zero</b>, 0 K.`)}
<h3>The ideal gas equation</h3>
${Fm(T`PV = nRT \qquad R = 8.314\ \mathrm{J\,mol^{-1}\,K^{-1}}`)}
<p>with $P$ in Pa, $V$ in m³ ($1\ \mathrm{L} = 10^{-3}\ \mathrm{m^3}$), $n$ in mol and $T$ in K. (With $P$ in atm and $V$ in L, use $R = 0.082\ \mathrm{L\,atm\,mol^{-1}\,K^{-1}}$.) <b>Avogadro's law</b> follows: equal volumes of gases at the same $T$ and $P$ contain equal numbers of molecules, so 1 mol of any gas takes 22.4 L at STP.</p>

{
  id: 'concentration', stage: 'sh', title: 'Solutions, Concentration & Solubility',
  blurb: 'Solute, solvent and solution, concentration in mol/L and g/L, percentage and ppm, preparing a standard solution, dilution, and solubility curves.',
  lesson: () => T`
<p>A <b>solution</b> is a uniform mixture of a <b>solute</b> dissolved in a <b>solvent</b>. Water is the most common solvent: solutions in water are called <b>aqueous</b>. "Like dissolves like": polar and ionic substances dissolve in polar solvents (water), non-polar substances in non-polar solvents (hexane, oil).</p>
${Key(T`<p><b>Molar concentration</b> (molarity) is the amount of solute per litre of solution: $$c = \frac{n}{V} \quad (\mathrm{mol/L}, \text{ also written M})$$ Mass concentration is in g/L; also used are % by mass, % by volume and parts per million: $1\ \mathrm{ppm} = 1\ \mathrm{mg}$ of solute per kg (≈ per L of water).</p>`)}
${FigRow([[beakerSvg({ n: 6, level: 0.6, seed: 2, name: '0.1 mol/L', label: T`A dilute solution: few solute particles` }), T`dilute`], [beakerSvg({ n: 18, level: 0.6, seed: 5, name: '0.3 mol/L', label: T`A concentrated solution: many solute particles in the same volume` }), T`concentrated`], [beakerSvg({ n: 6, level: 0.3, seed: 7, name: '0.2 mol/L', label: T`The same six particles in half the volume: double the concentration` }), T`same $n$, half $V$`]], T`Concentration counts solute particles per volume: more particles, or less solvent, means a more concentrated solution.`)}
<h3>Making and diluting a solution</h3>
${Fig(apparatusSvg([['beaker', T`1. dissolve the weighed solid`], ['funnel', T`2. transfer and rinse`], ['flask', T`3. fill to the mark`], ['tube', T`4. stopper and invert`]], { label: T`Preparing a standard solution: dissolve, transfer, make up to the mark, mix` }), T`A <b>standard solution</b> has an accurately known concentration: weigh the solid, dissolve it, transfer everything into a volumetric flask and fill with water until the bottom of the meniscus is on the mark.`)}
${Key(T`<p>When a solution is <b>diluted</b>, water is added but the amount of solute stays the same: $$c_1V_1 = c_2V_2$$</p>`)}
${Ex(T`<p>How do you make 250 mL of 0.20 mol/L HCl from a 2.0 mol/L stock? $V_1 = \frac{0.20 \times 250}{2.0} = 25$ mL of stock, made up to 250 mL with water.</p>`)}
<h3>Solubility</h3>
<p>The <b>solubility</b> is the maximum mass of solute that dissolves in 100 g of water at a given temperature, giving a <b>saturated</b> solution. For most solids it increases with temperature; for gases it decreases (warm fizzy drinks go flat faster).</p>
${Fig(lineChartSvg([['KNO3', 'KNO₃'], ['NH4Cl', 'NH₄Cl'], ['KCl', 'KCl'], ['NaCl', 'NaCl']].map(([f, t], i) => ({ pts: SOL[f].map((v, k) => [k * 20, v]), label: t, cls: 'g-l' + (i + 1), dx: 4, dy: i === 2 ? -2 : i === 3 ? 12 : -4, anchor: 'start' })), { W: 440, H: 290, R: 64, xMin: 0, xMax: 100, xStep: 20, yMin: 0, yMax: 250, yStep: 50, xl: T`temperature (°C)`, yl: T`solubility (g per 100 g water)`, label: T`Solubility curves: potassium nitrate rises steeply, ammonium chloride and potassium chloride moderately, sodium chloride hardly changes` }), T`Solubility curves (CRC Handbook data). Potassium nitrate is far more soluble when hot, so it crystallises out on cooling; sodium chloride hardly changes, so salt is obtained by evaporation instead.`)}
${Tip(T`<p>Read a solubility curve like this: at 60 °C, 110 g of $\ce{KNO3}$ dissolves in 100 g of water. Cool it to 20 °C, where only 31.6 g dissolves, and $110 - 31.6 = 78.4$ g of crystals form.</p>`)}`,

{
  id: 'colligative', stage: 'sh', title: 'Colligative Properties',
  blurb: 'Properties that depend only on the number of dissolved particles: vapour-pressure lowering, boiling-point elevation, freezing-point depression and osmotic pressure; molality and the van ’t Hoff factor.',
  lesson: () => T`
<p>Dissolving a solute changes some properties of the solvent in a way that depends only on the <b>number</b> of dissolved particles, not on what they are. These are the <b>colligative properties</b>. Solute particles take up part of the surface, so fewer solvent molecules escape: the vapour pressure is lower, the solution boils at a higher temperature and freezes at a lower one.</p>
${Fig(phaseDiagramSvg({ solution: true, names: { T: T`temperature`, P: T`pressure`, s: T`solid`, l: T`liquid`, g: T`gas`, tp: T`triple point`, cp: T`critical point`, mp: T`freezing point`, bp: T`boiling point` }, label: T`Phase diagram of water with the dashed curves of a solution: the freezing point moves lower and the boiling point higher` }), T`Phase diagram of water (not to scale). The dashed curves belong to a solution: at 1 atm it freezes below 0 °C and boils above 100 °C.`)}
${Key(T`<p>These effects use the <b>molality</b> $m$ = moles of solute per kg of <i>solvent</i> (it does not change with temperature):</p><p>$$\Delta T_b = K_b \cdot m \cdot i \qquad \Delta T_f = K_f \cdot m \cdot i$$</p><p>For water $K_b = 0.52$ °C kg/mol and $K_f = 1.86$ °C kg/mol. The <b>van 't Hoff factor</b> $i$ is the number of particles per formula unit: 1 for sugar or urea, 2 for $\ce{NaCl}$ ($\ce{Na+}$ + $\ce{Cl-}$), 3 for $\ce{CaCl2}$ (for complete dissociation).</p>`)}
${Ex(T`<p>Freezing point of 0.50 mol $\ce{NaCl}$ in 1 kg of water: $\Delta T_f = 1.86 \times 0.50 \times 2 = 1.86$ °C, so it freezes at −1.86 °C. This is why salt is spread on icy roads.</p>`)}
<h3>Osmosis</h3>
${Fig(osmosisSvg({ names: [T`pure water`, T`solution`, T`semipermeable membrane`, T`water flows in`], label: T`Osmosis in a U-tube: water passes through the membrane into the solution, whose level rises` }), T`Water molecules pass through a semipermeable membrane into the more concentrated solution until the extra height $h$ balances the flow. The pressure needed to stop osmosis is the <b>osmotic pressure</b>.`)}
${Fm(T`\pi = M R T \, i`)}
<p>with $M$ in mol/L, $R = 0.082$ L atm mol⁻¹ K⁻¹ and $T$ in K. Osmosis explains why red blood cells swell in pure water, why salted vegetables shrink, and how reverse osmosis turns seawater into drinking water.</p>
${Tip(T`<p>Compare solutions by the <b>total</b> particle concentration $m \cdot i$: 0.1 mol/kg $\ce{CaCl2}$ (0.3 mol of particles) lowers the freezing point more than 0.2 mol/kg glucose (0.2 mol of particles).</p>`)}`,

    () => { const [s, i] = pick([[T`glucose`, 1], [T`urea`, 1], ['$\\ce{NaCl}$', 2], ['$\\ce{KBr}$', 2], ['$\\ce{CaCl2}$', 3], ['$\\ce{MgCl2}$', 3]]), m = pick([0.1, 0.2, 0.25, 0.5, 1]), d = sig(1.86 * m * i, 3); return { q: T`What is the freezing point (in °C) of a ${NUM(m)} mol/kg aqueous solution of ${s}? ($K_f = 1.86$ °C kg/mol, complete dissociation)`, a: -d, u: '°C', rtol: 0.01, w: [d, sig(-1.86 * m, 3) === -d ? sig(-d * 2, 3) : sig(-1.86 * m, 3), sig(-0.52 * m * i, 3)], s: T`$i = ${i}$; $\Delta T_f = 1.86 \times ${M(m)} \times ${i} = ${M(d)}$ °C, so it freezes at $${M(-d)}$ °C.` }; },
    () => { const [s, i] = pick([[T`sucrose`, 1], ['$\\ce{NaCl}$', 2], ['$\\ce{CaCl2}$', 3]]), m = pick([0.5, 1, 2]), d = sig(0.52 * m * i, 3); return { q: T`What is the boiling point (in °C) of a ${NUM(m)} mol/kg aqueous solution of ${s} at 1 atm? ($K_b = 0.52$ °C kg/mol)`, a: sig(100 + d, 5), u: '°C', rtol: 0.0001, w: [sig(100 - d, 5), sig(100 + 0.52 * m, 5) === sig(100 + d, 5) ? sig(100 + 2 * d, 5) : sig(100 + 0.52 * m, 5), sig(100 + 1.86 * m * i, 5)], s: T`$\Delta T_b = 0.52 \times ${M(m)} \times ${i} = ${M(d)}$ °C: boils at $${M(sig(100 + d, 5))}$ °C.` }; },
    () => { const mass = pick([9, 18, 36, 90, 45]), kg = pick([0.1, 0.25, 0.5, 1]), m = sig(mass / 180 / kg, 3); return { q: T`${NUM(mass)} g of glucose ($M = 180$ g/mol) is dissolved in ${NUM(kg * 1000)} g of water. What is the molality (in mol/kg)?`, a: m, u: 'mol/kg', rtol: 0.01, w: [sig(mass / 180, 3), sig(mass / 180 * kg, 3), sig(mass / kg, 3)], s: T`$m = \frac{${M(mass)} / 180}{${M(kg)}} = ${M(m)}$ mol/kg.` }; },

    () => pick([
      { q: T`Why is salt spread on icy roads?`, a: T`It lowers the freezing point of water`, w: [T`It raises the freezing point of water`, T`It reacts with ice to release heat`, T`It makes the road rougher`], only: 'mc', s: T`Freezing-point depression: salty water stays liquid below 0 °C.` },
      { q: T`A red blood cell is put in pure water. What happens?`, a: T`Water enters the cell by osmosis and it swells`, w: [T`Water leaves the cell and it shrinks`, T`Nothing happens`, T`Salt enters the cell`], only: 'mc', s: T`The inside of the cell is more concentrated, so water flows in.` },
    ]),

{
  id: 'colloids', stage: 'sh', title: 'Colloids',
  blurb: 'True solutions, colloids and suspensions, the types of colloid (sol, emulsion, foam, aerosol, gel), the Tyndall effect, Brownian motion, and making and using colloids.',
  lesson: () => T`
<p>Mixtures can be sorted by the size of the dispersed particles. In a <b>true solution</b> they are single molecules or ions (below 1 nm); in a <b>suspension</b> they are large enough to settle and be filtered off. In between is a <b>colloid</b>: particles of 1–1000 nm that stay spread out and look uniform, but are much bigger than molecules.</p>
${Fig(sizeScaleSvg({ names: [T`solution`, T`colloid`, T`suspension`, T`particle size (logarithmic scale)`], label: T`Particle size scale: solutions below 1 nanometre, colloids from 1 nanometre to 1 micrometre, suspensions above` }), T`Particle size decides the type of mixture.`)}
${Tbl([T`Property`, T`Solution`, T`Colloid`, T`Suspension`], [[T`appearance`, T`clear`, T`cloudy or clear`, T`cloudy`], [T`settles on standing?`, T`no`, T`no`, T`yes`], [T`separated by filter paper?`, T`no`, T`no`, T`yes`], [T`Tyndall effect?`, T`no`, T`yes`, T`yes (but opaque)`], [T`example`, T`sugar water`, T`milk, fog`, T`muddy water`]])}
${Fig(tyndallSvg({ names: [T`solution`, T`colloid`], label: T`The Tyndall effect: a light beam is invisible in a solution but visible in a colloid` }), T`The <b>Tyndall effect</b>: colloid particles scatter light, so a beam is visible through a colloid but not through a true solution. Car headlights in fog and sunbeams in a dusty room are examples.`)}
${Tbl([T`Dispersed phase`, T`in medium`, T`Name`, T`Examples`], [[T`solid`, T`liquid`, T`sol`, T`paint, ink, blood`], [T`liquid`, T`liquid`, T`emulsion`, T`milk, mayonnaise`], [T`gas`, T`liquid`, T`foam`, T`whipped cream, soap foam`], [T`liquid`, T`gas`, T`liquid aerosol`, T`fog, clouds, hairspray`], [T`solid`, T`gas`, T`solid aerosol`, T`smoke, dust`], [T`liquid`, T`solid`, T`gel`, T`jelly, cheese, butter`], [T`gas`, T`solid`, T`solid foam`, T`pumice, marshmallow`], [T`solid`, T`solid`, T`solid sol`, T`coloured glass, some alloys`]])}
${Key(T`<p>Other properties: <b>Brownian motion</b> (colloid particles jiggle randomly because solvent molecules hit them unevenly), <b>adsorption</b> (particles hold ions on their surface; used in water treatment with alum), <b>coagulation</b> (adding an electrolyte or heat makes particles clump, as in making tofu or latex), and <b>dialysis</b> (ions pass through a membrane, colloid particles do not; used in kidney machines). An <b>emulsifier</b> such as soap or egg yolk (lecithin) keeps an emulsion from separating.</p>`)}
${Tip(T`<p>Colloids are made by <b>dispersion</b> (breaking big particles down, e.g. grinding, or shaking oil with soap) or <b>condensation</b> (joining small particles up, e.g. hydrolysis of $\ce{FeCl3}$ in hot water to form an $\ce{Fe(OH)3}$ sol).</p>`)}`,
  gens: [

<p>Experiments show how the rate depends on each concentration. For $\ce{A + B -> products}$ the <b>rate equation</b> is $$\text{rate} = k[\mathrm{A}]^m[\mathrm{B}]^n$$ where $m$ and $n$ are the <b>orders</b> with respect to A and B (usually 0, 1 or 2) and $k$ is the <b>rate constant</b>. The overall order is $m + n$. Orders are found by experiment, <i>not</i> from the coefficients in the equation.</p>
${FigRow([[planeSvg({ W: 220, H: 180, x: [0, 5.4], y: [0, 5.4], step: [1, 1], ticks: false, xl: '[A]', yl: T`rate`, fns: [{ f: () => 3, from: 0, to: 5, cls: 'mf-c1' }], label: T`Zero order: the rate does not depend on the concentration` }), T`zero order`], [planeSvg({ W: 220, H: 180, x: [0, 5.4], y: [0, 5.4], step: [1, 1], ticks: false, xl: '[A]', yl: T`rate`, fns: [{ f: x => x, from: 0, to: 5, cls: 'mf-c1' }], label: T`First order: the rate is proportional to the concentration` }), T`first order`], [planeSvg({ W: 220, H: 180, x: [0, 5.4], y: [0, 5.4], step: [1, 1], ticks: false, xl: '[A]', yl: T`rate`, fns: [{ f: x => x * x / 4.5, from: 0, to: 5, cls: 'mf-c1' }], label: T`Second order: the rate is proportional to the concentration squared` }), T`second order`]], T`Rate against concentration: flat for zero order, a straight line through the origin for first order, a curve (parabola) for second order.`)}

  blurb: 'Reversible reactions and dynamic equilibrium, Le Chatelier’s principle, the equilibrium constants Kc and Kp, the reaction quotient, and industrial processes (Haber, Contact).',
  lesson: () => T`
<p>Many reactions are <b>reversible</b> ($\rightleftharpoons$): the products can react to give back the reactants. In a closed system the forward reaction slows down as reactants are used up, the backward reaction speeds up as products build up, until both rates are equal. This is <b>dynamic equilibrium</b>: both reactions keep going, but the concentrations no longer change.</p>
${FigRow([[planeSvg({ W: 280, H: 210, x: [0, 10.5], y: [0, 1.1], step: [1, 0.25], ticks: false, xl: T`time`, yl: T`concentration`, fns: [{ f: t => 0.3 + 0.7 * Math.exp(-t / 1.6), from: 0, to: 10, cls: 'mf-c1', label: T`reactants`, at: 8, dy: -8, anchor: 'middle' }, { f: t => 0.7 * (1 - Math.exp(-t / 1.6)), from: 0, to: 10, cls: 'mf-c4', label: T`products`, at: 8, dy: -8, anchor: 'middle' }], segs: [[5, 0, 5, 1.05, 'mf-grid', true]], texts: [[7.6, 1.0, T`equilibrium`, 'middle', 'mf-small']], label: T`Concentrations level off when equilibrium is reached` }), T`concentrations become constant`], [planeSvg({ W: 280, H: 210, x: [0, 10.5], y: [0, 1.1], step: [1, 0.25], ticks: false, xl: T`time`, yl: T`rate`, fns: [{ f: t => 0.4 + 0.6 * Math.exp(-t / 1.5), from: 0, to: 10, cls: 'mf-c1', label: T`forward`, at: 1.2, dx: 6, dy: -4 }, { f: t => 0.4 * (1 - Math.exp(-t / 1.5)), from: 0, to: 10, cls: 'mf-c4', label: T`backward`, at: 1.5, dx: 6, dy: 14 }], segs: [[5, 0, 5, 1.05, 'mf-grid', true]], label: T`The forward rate falls and the backward rate rises until they are equal` }), T`forward rate = backward rate`]], T`Approaching equilibrium from pure reactants.`)}
${Key(T`<p><b>Le Chatelier's principle:</b> if a system at equilibrium is disturbed, the position of equilibrium shifts to oppose the change.</p>`)}
${Tbl([T`Change`, T`Equilibrium shifts`, T`Example: $\ce{N2 + 3H2 <=> 2NH3}$, $\Delta H = -92$ kJ`], [[T`add a reactant`, T`to the right (uses it up)`, T`more $\ce{NH3}$`], [T`increase pressure`, T`to the side with fewer gas molecules`, T`right (4 → 2 molecules): more $\ce{NH3}$`], [T`increase temperature`, T`in the endothermic direction`, T`left: less $\ce{NH3}$`], [T`add a catalyst`, T`no shift: equilibrium is only reached faster`, T`iron catalyst`]])}

  blurb: 'Arrhenius, Brønsted–Lowry and Lewis definitions, conjugate acid–base pairs, amphoteric substances, strong and weak acids and bases, and the acid dissociation constant Ka.',
  lesson: () => T`
<p>Three definitions, each wider than the last:</p>
${Tbl([T`Theory`, T`Acid`, T`Base`, T`Example`], [[T`Arrhenius (1884)`, T`gives $\ce{H+}$ in water`, T`gives $\ce{OH-}$ in water`, '$\\ce{HCl}$, $\\ce{NaOH}$'], [T`Brønsted–Lowry (1923)`, T`proton ($\ce{H+}$) donor`, T`proton acceptor`, '$\\ce{NH3 + H2O <=> NH4+ + OH-}$'], [T`Lewis (1923)`, T`electron-pair acceptor`, T`electron-pair donor`, '$\\ce{BF3 + NH3 -> F3B-NH3}$']])}
${Key(T`<p>In a Brønsted–Lowry reaction the acid gives $\ce{H+}$ to the base. What remains of the acid is its <b>conjugate base</b>; the base becomes its <b>conjugate acid</b>: $$\underset{\text{acid}}{\ce{HCl}} + \underset{\text{base}}{\ce{H2O}} \ce{->} \underset{\text{conj. acid}}{\ce{H3O+}} + \underset{\text{conj. base}}{\ce{Cl-}}$$ Conjugate pairs differ by exactly one $\ce{H+}$. Water can act as an acid or a base: it is <b>amphoteric</b>.</p>`)}
<h3>Strong and weak</h3>
${Fig(dissociationSvg({ names: [T`strong acid: fully ionised`, T`weak acid: mostly molecules`], label: T`A strong acid is completely split into hydrogen ions and anions; a weak acid is mostly undissociated molecules with only a few ions` }), T`A <b>strong</b> acid ($\ce{HCl}$, $\ce{HNO3}$, $\ce{H2SO4}$) ionises completely in water. A <b>weak</b> acid ($\ce{CH3COOH}$, citric acid, carbonic acid) ionises only partly: an equilibrium $\ce{HA <=> H+ + A-}$ lies far to the left. For ethanoic acid only about 1% of molecules are ionised at 0.1 M.`)}
${Key(T`<p>The strength of a weak acid is measured by the <b>acid dissociation constant</b>: $$K_a = \frac{[\ce{H+}][\ce{A-}]}{[\ce{HA}]} \qquad pK_a = -\log K_a$$ The larger $K_a$ (the smaller $pK_a$), the stronger the acid. Ethanoic acid: $K_a = 1.8 \times 10^{-5}$, $pK_a = 4.74$. Similarly $K_b$ for weak bases such as ammonia ($K_b = 1.8 \times 10^{-5}$).</p>`)}
${Tip(T`<p>Strong ≠ concentrated. "Strong" means fully ionised; "concentrated" means a lot of acid per litre. A dilute solution of a strong acid can have the same pH as a concentrated weak acid.</p>`)}`,

  lesson: () => T`
${Key(T`<p>$$\mathrm{pH} = -\log[\ce{H+}] \qquad [\ce{H+}] = 10^{-\mathrm{pH}}$$ Water ionises very slightly: $\ce{H2O <=> H+ + OH-}$ with $$K_w = [\ce{H+}][\ce{OH-}] = 1.0 \times 10^{-14} \text{ at } 25\ °\mathrm{C}$$ so $\mathrm{pH} + \mathrm{pOH} = 14$. In pure water $[\ce{H+}] = [\ce{OH-}] = 10^{-7}$ M and pH = 7.</p>`)}
${Fig(planeSvg({ W: 420, H: 250, x: [0, 14.5], y: [0, 14.5], step: [1, 1], tickX: 2, tickY: 2, xl: 'pH', yl: T`−log c`, fns: [{ f: p => p, from: 0, to: 14, cls: 'mf-c4', label: '[H⁺]', at: 11.5, dx: 6, dy: 14 }, { f: p => 14 - p, from: 0, to: 14, cls: 'mf-c1', label: '[OH⁻]', at: 11.5, dx: 6, dy: -4 }], segs: [[7, 0, 7, 7, 'mf-grid', true]], pts: [[7, 7, T`neutral`, 'start']], label: T`As pH rises, the hydrogen ion concentration falls and the hydroxide concentration rises; they are equal at pH 7` }), T`$-\log[\ce{H+}]$ and $-\log[\ce{OH-}]$ against pH: the lines cross at pH 7, where both are $10^{-7}$ M. Their sum is always 14.`)}
<h3>Strong acids and bases</h3>
<p>They ionise completely, so for a monoprotic strong acid $[\ce{H+}] = c$: 0.01 M HCl has pH $= -\log 0.01 = 2$. For a strong base, find $[\ce{OH-}]$, then pOH, then pH $= 14 - \mathrm{pOH}$: 0.01 M NaOH has pOH 2, pH 12. For $\ce{Ba(OH)2}$ or $\ce{H2SO4}$ count 2 per formula.</p>

  id: 'titration', stage: 'sh', title: 'Acid–Base Titration',
  blurb: 'Titration technique, the equivalence point and end point, choosing an indicator, titration curves for strong and weak acids, and titration calculations.',
  lesson: () => T`
<p>A <b>titration</b> finds the unknown concentration of a solution by reacting it exactly with a standard solution. A pipette measures a fixed volume of one solution into a conical flask with a few drops of indicator; the other solution is added from a burette until the indicator just changes colour.</p>
${Fig(titrationSetupSvg({ names: [T`burette (titrant)`, T`tap`, T`conical flask + indicator`, T`white tile`], label: T`Titration set-up: a burette clamped above a conical flask standing on a white tile` }), T`Titration set-up. Read the burette at the bottom of the meniscus, swirl the flask, and add the titrant drop by drop near the end point. Repeat until two titres agree within 0.10 mL.`)}
${Key(T`<p>At the <b>equivalence point</b> the acid and base have reacted in exactly the ratio of the equation. The <b>end point</b> is where the indicator changes colour; a good indicator changes colour at (close to) the equivalence point. $$n = c \times V \qquad \frac{c_aV_a}{a} = \frac{c_bV_b}{b}$$ for $a$ acid + $b$ base in the equation.</p>`)}
${FigRow([[titrationSvg({ W: 300, H: 250, bands: [[8.2, 10, 'mf-f2', T`phenolphthalein`], [3.1, 4.4, 'mf-f1', T`methyl orange`]], names: { x: T`V NaOH (mL)`, eq: T`equivalence` }, label: T`Titration curve of hydrochloric acid with sodium hydroxide: a steep rise from pH 3 to 11 at 25 millilitres` }), T`strong acid + strong base: equivalence at pH 7`], [titrationSvg({ W: 300, H: 250, Ka: 1.8e-5, bands: [[8.2, 10, 'mf-f2', T`phenolphthalein`], [3.1, 4.4, 'mf-f1', T`methyl orange`]], names: { x: T`V NaOH (mL)`, eq: T`equivalence` }, label: T`Titration curve of ethanoic acid with sodium hydroxide: starts at pH 2.9, equivalence near pH 8.7` }), T`weak acid + strong base: equivalence at pH 8.7`]], T`Curves calculated for 25.0 mL of 0.100 M acid titrated with 0.100 M NaOH. For the strong acid both indicators change within the vertical part. For ethanoic acid the jump is shorter and above 7, so only phenolphthalein works. At half-equivalence (12.5 mL) pH = $pK_a$ = 4.74.`)}
${Ex(T`<p>25.0 mL of NaOH needs 20.0 mL of 0.100 M $\ce{H2SO4}$. $n(\ce{H2SO4}) = 0.100 \times 0.0200 = 2.00 \times 10^{-3}$ mol; $\ce{H2SO4 + 2NaOH -> Na2SO4 + 2H2O}$, so $n(\ce{NaOH}) = 4.00 \times 10^{-3}$ mol and $c = \frac{4.00 \times 10^{-3}}{0.0250} = 0.160$ M.</p>`)}
${Tip(T`<p>Rinse the burette with the titrant and the pipette with the solution it will measure, but rinse the conical flask with distilled water only: water in the flask does not change the number of moles in it.</p>`)}`,

    () => { const [t, a] = pick([[T`a strong acid with a strong base`, T`phenolphthalein or methyl orange`], [T`a weak acid with a strong base`, T`phenolphthalein`], [T`a strong acid with a weak base`, T`methyl orange`]]); return { q: T`Which indicator is suitable for titrating ${t}?`, a, w: [T`phenolphthalein or methyl orange`, T`phenolphthalein`, T`methyl orange`, T`no indicator works`].filter(x => x !== a), only: 'mc', s: T`The indicator must change colour within the steep part of the curve: <b>${a}</b>.` }; },
